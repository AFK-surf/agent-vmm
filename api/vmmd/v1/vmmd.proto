syntax = "proto3";

package agentvmm.vmmd.v1;

option go_package = "github.com/AFK-surf/agent-vmm/api/vmmd/v1;vmmdv1";

service VMMDService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc PrepareShutdown(PrepareShutdownRequest) returns (PrepareShutdownResponse);

  rpc EnsureNamespace(EnsureNamespaceRequest) returns (EnsureNamespaceResponse);
  rpc DeleteNamespace(DeleteNamespaceRequest) returns (DeleteNamespaceResponse);
  rpc GetNamespace(GetNamespaceRequest) returns (GetNamespaceResponse);
  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse);
  rpc GetNamespaceUsage(GetNamespaceUsageRequest) returns (GetUsageResponse);
  rpc GetSystemUsage(GetSystemUsageRequest) returns (GetUsageResponse);
  rpc PullImage(PullImageRequest) returns (stream PullImageResponse);

  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse);
  rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse);
  rpc GetVolume(GetVolumeRequest) returns (GetVolumeResponse);
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);

  rpc GetImage(GetImageRequest) returns (GetImageResponse);
  rpc ListImages(ListImagesRequest) returns (ListImagesResponse);

  rpc CreateContainer(CreateContainerRequest) returns (CreateContainerResponse);
  rpc StartContainer(StartContainerRequest) returns (StartContainerResponse);
  rpc StopContainer(StopContainerRequest) returns (StopContainerResponse);
  rpc WaitContainer(WaitContainerRequest) returns (WaitContainerResponse);
  rpc DeleteContainer(DeleteContainerRequest) returns (DeleteContainerResponse);
  rpc InspectContainer(InspectContainerRequest) returns (InspectContainerResponse);
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse);
  rpc GetContainerUsage(GetContainerUsageRequest) returns (GetUsageResponse);
  rpc Logs(LogsRequest) returns (stream LogsResponse);

  rpc Exec(stream ExecRequest) returns (stream ExecResponse);
  rpc SignalContainer(SignalContainerRequest) returns (SignalContainerResponse);

  rpc ApplyNetworkLink(ApplyNetworkLinkRequest) returns (ApplyNetworkLinkResponse);
  rpc DeleteNetworkLink(DeleteNetworkLinkRequest) returns (DeleteNetworkLinkResponse);
  rpc ForwardTCP(stream ForwardTCPRequest) returns (stream ForwardTCPResponse);
  rpc BuildImage(stream BuildImageRequest) returns (stream BuildImageResponse);
  rpc ComponentHealth(ComponentHealthRequest) returns (ComponentHealthResponse);
  rpc ProbeEgress(ProbeEgressRequest) returns (ProbeEgressResponse);
  rpc WatchEvents(WatchEventsRequest) returns (stream RuntimeEvent);
}

message HealthRequest {}

message HealthResponse {
  bool ready = 1;
  bool state_initialized = 2;
  bool root_read_only = 3;
  string boot_id = 4;
  string manifest_digest = 5;
  map<string, string> runtime_versions = 6;
}

message PrepareShutdownRequest {
  string request_id = 1;
}
message PrepareShutdownResponse {}

enum EgressMode {
  EGRESS_MODE_UNSPECIFIED = 0;
  EGRESS_MODE_DENY_ALL = 1;
  EGRESS_MODE_PUBLIC_INTERNET = 2;
}

message NamespaceLimits {
  uint32 cpu_millis = 1;
  uint64 memory_bytes = 2;
  uint32 pids = 3;
  uint64 disk_bytes = 4;
}

message Namespace {
  string id = 1;
  NamespaceLimits limits = 2;
  EgressMode egress_mode = 3;
  uint32 project_id = 4;
  string subnet = 5;
  string observed_status = 6;
}

message EnsureNamespaceRequest {
  string request_id = 1;
  string namespace_id = 2;
  NamespaceLimits limits = 3;
  EgressMode egress_mode = 4;
}
message EnsureNamespaceResponse {
  Namespace namespace = 1;
}

message DeleteNamespaceRequest {
  string request_id = 1;
  string namespace_id = 2;
}
message DeleteNamespaceResponse {}
message GetNamespaceRequest {
  string namespace_id = 1;
}
message GetNamespaceResponse {
  Namespace namespace = 1;
}
message ListNamespacesRequest {}
message ListNamespacesResponse {
  repeated Namespace namespaces = 1;
}
message GetNamespaceUsageRequest {
  string namespace_id = 1;
}
message GetSystemUsageRequest {}

message PullImageRequest {
  string request_id = 1;
  string actor_namespace_id = 2;
  string reference = 3;
}
message PullImageResponse {
  string status = 1;
  optional string digest = 2;
  uint64 logical_bytes = 3;
}

message Volume {
  string id = 1;
  string namespace_id = 2;
  uint64 current_bytes = 3;
  uint64 limit_bytes = 4;
  repeated string mounted_by = 5;
}
message CreateVolumeRequest {
  string request_id = 1;
  string actor_namespace_id = 2;
  string volume_id = 3;
}
message CreateVolumeResponse {
  Volume volume = 1;
}
message DeleteVolumeRequest {
  string request_id = 1;
  string actor_namespace_id = 2;
  string volume_id = 3;
}
message DeleteVolumeResponse {}
message GetVolumeRequest {
  string actor_namespace_id = 1;
  string volume_id = 2;
}
message GetVolumeResponse {
  Volume volume = 1;
}
message ListVolumesRequest {
  string actor_namespace_id = 1;
}
message ListVolumesResponse {
  repeated Volume volumes = 1;
}

message Image {
  string reference = 1;
  string digest = 2;
  uint64 logical_bytes = 3;
  repeated string platforms = 4;
}
message GetImageRequest {
  string actor_namespace_id = 1;
  string reference = 2;
}
message GetImageResponse {
  Image image = 1;
}
message ListImagesRequest {
  string actor_namespace_id = 1;
}
message ListImagesResponse {
  repeated Image images = 1;
}

message ResourceLimits {
  optional uint32 cpu_millis = 1;
  optional uint64 memory_bytes = 2;
  optional uint32 pids = 3;
}

message VolumeMount {
  string volume_id = 1;
  string destination = 2;
  bool read_only = 3;
}

enum ContainerState {
  CONTAINER_STATE_UNSPECIFIED = 0;
  CONTAINER_STATE_CREATED = 1;
  CONTAINER_STATE_RUNNING = 2;
  CONTAINER_STATE_STOPPED = 3;
}

message Container {
  string id = 1;
  string namespace_id = 2;
  string image = 3;
  ContainerState state = 4;
  optional uint32 exit_code = 5;
  repeated VolumeMount volumes = 6;
	repeated string argv = 7;
	repeated string env = 8;
	optional string workdir = 9;
	optional string user = 10;
}

message CreateContainerRequest {
  string request_id = 1;
  string actor_namespace_id = 2;
  string container_id = 3;
  string image = 4;
  repeated string argv = 5;
  repeated string env = 6;
  optional string workdir = 7;
  optional string user = 8;
  ResourceLimits limits = 9;
  repeated VolumeMount volumes = 10;
  bool read_only_root = 11;
  uint64 log_limit_bytes = 12;
}
message CreateContainerResponse {
  Container container = 1;
}

message StartContainerRequest {
  string request_id = 1;
  string actor_namespace_id = 2;
  string container_id = 3;
}
message StartContainerResponse {
  Container container = 1;
}

message StopContainerRequest {
  string request_id = 1;
  string actor_namespace_id = 2;
  string container_id = 3;
  optional uint32 timeout_seconds = 4;
}
message StopContainerResponse {
  Container container = 1;
}

message WaitContainerRequest {
  string actor_namespace_id = 1;
  string container_id = 2;
}
message WaitContainerResponse {
  uint32 exit_code = 1;
}

message DeleteContainerRequest {
  string request_id = 1;
  string actor_namespace_id = 2;
  string container_id = 3;
}
message DeleteContainerResponse {}

message InspectContainerRequest {
  string actor_namespace_id = 1;
  string container_id = 2;
}
message InspectContainerResponse {
  Container container = 1;
}
message ListContainersRequest {
  string actor_namespace_id = 1;
}
message ListContainersResponse {
  repeated Container containers = 1;
}
message GetContainerUsageRequest {
  string actor_namespace_id = 1;
  string container_id = 2;
}

message Usage {
  uint64 cpu_nanos = 1;
  uint64 memory_bytes = 2;
  uint32 pids = 3;
  uint64 read_bytes = 4;
  uint64 write_bytes = 5;
  uint64 disk_bytes = 6;
  int64 sampled_at_unix_nano = 7;
  bool unavailable = 8;
  string unavailable_reason = 9;
  uint64 network_rx_bytes = 10;
  uint64 network_tx_bytes = 11;
}
message GetUsageResponse {
  Usage usage = 1;
}

enum LogStream {
  LOG_STREAM_UNSPECIFIED = 0;
  LOG_STREAM_STDOUT = 1;
  LOG_STREAM_STDERR = 2;
}
message LogsRequest {
  string actor_namespace_id = 1;
  string container_id = 2;
  uint64 tail_records = 3;
  int64 since_unix_nano = 4;
  string after_cursor = 5;
  bool follow = 6;
}
message LogsResponse {
  string cursor = 1;
  int64 timestamp_unix_nano = 2;
  LogStream stream = 3;
  bytes data = 4;
  bool truncated = 5;
  uint64 dropped_records = 6;
}

enum ProcessSignal {
  PROCESS_SIGNAL_UNSPECIFIED = 0;
  PROCESS_SIGNAL_TERM = 1;
  PROCESS_SIGNAL_KILL = 2;
  PROCESS_SIGNAL_INT = 3;
}
message SignalContainerRequest {
  string request_id = 1;
  string actor_namespace_id = 2;
  string container_id = 3;
  ProcessSignal signal = 4;
}
message SignalContainerResponse {}

message ExecStart {
  string request_id = 1;
  string actor_namespace_id = 2;
  string container_id = 3;
  repeated string argv = 4;
  repeated string env = 5;
  optional string workdir = 6;
  optional string user = 7;
  bool tty = 8;
  uint32 rows = 9;
  uint32 columns = 10;
}
message ExecResize {
  uint32 rows = 1;
  uint32 columns = 2;
}
message ExecRequest {
  oneof event {
    ExecStart start = 1;
    bytes stdin = 2;
    bool close_stdin = 3;
    ExecResize resize = 4;
    ProcessSignal signal = 5;
  }
}
message ExecResponse {
  oneof event {
    bytes stdout = 1;
    bytes stderr = 2;
    uint32 exit_code = 3;
  }
}

message ContainerIDList {
  repeated string ids = 1;
}
message ContainerSelector {
  oneof selection {
    bool all_containers = 1;
    ContainerIDList container_ids = 2;
  }
}
message NetworkLink {
  string id = 1;
  string source_namespace_id = 2;
  string destination_namespace_id = 3;
  ContainerSelector source = 4;
  ContainerSelector destination = 5;
  repeated uint32 tcp_ports = 6;
  string dns_alias = 7;
}
message ApplyNetworkLinkRequest {
  string request_id = 1;
  NetworkLink link = 2;
}
message ApplyNetworkLinkResponse {}
message DeleteNetworkLinkRequest {
  string request_id = 1;
  string link_id = 2;
}
message DeleteNetworkLinkResponse {}

message ForwardTCPHeader {
  string actor_namespace_id = 1;
  string container_id = 2;
  uint32 port = 3;
}
message ForwardTCPRequest {
  oneof event {
    ForwardTCPHeader header = 1;
    bytes data = 2;
    bool close_write = 3;
  }
}
message ForwardTCPResponse {
  oneof event {
    bytes data = 1;
    bool close_read = 2;
  }
}

enum BuildNetworkMode {
  BUILD_NETWORK_MODE_UNSPECIFIED = 0;
  BUILD_NETWORK_MODE_NONE = 1;
  BUILD_NETWORK_MODE_NAMESPACE_EGRESS = 2;
}
message BuildArgument {
  string name = 1;
  string value = 2;
}
message BuildSecret {
  string id = 1;
}
message BuildImageHeader {
  string request_id = 1;
  string actor_namespace_id = 2;
  string dockerfile_path = 3;
  string image = 4;
  optional string target = 5;
  repeated BuildArgument build_args = 6;
  BuildNetworkMode network_mode = 7;
  repeated BuildSecret secrets = 8;
}
message BuildContextChunk {
  bytes data = 1;
  bool final = 2;
}
message BuildSecretChunk {
  string id = 1;
  bytes data = 2;
  bool final = 3;
}
message BuildImageRequest {
  oneof event {
    BuildImageHeader header = 1;
    BuildContextChunk context = 2;
    BuildSecretChunk secret = 3;
  }
}
message BuildImageResult {
  string image = 1;
  string digest = 2;
}
message BuildImageResponse {
  oneof event {
    string progress = 1;
    BuildImageResult result = 2;
  }
}

enum ComponentState {
  COMPONENT_STATE_UNSPECIFIED = 0;
  COMPONENT_STATE_HEALTHY = 1;
  COMPONENT_STATE_DEGRADED = 2;
  COMPONENT_STATE_UNAVAILABLE = 3;
}
message ComponentStatus {
  string component = 1;
  ComponentState state = 2;
  string reason = 3;
  int64 observed_at_unix_nano = 4;
}
message ComponentHealthRequest {}
message ComponentHealthResponse {
  repeated ComponentStatus components = 1;
}

message ProbeEgressRequest {
  string namespace_id = 1;
}

message ProbeEgressResponse {
  bool policy_enforced = 1;
  bool dns_ok = 2;
  bool tcp_ok = 3;
  bool private_denied = 4;
  string failure_layer = 5;
  string reason = 6;
}

message ResourceReference {
  string kind = 1;
  string namespace_id = 2;
  string resource_id = 3;
}
message WatchEventsRequest {
  uint64 after_sequence = 1;
}
message RuntimeEvent {
  uint64 sequence = 1;
  string type = 2;
  ResourceReference resource = 3;
  string guest_boot_id = 4;
  string request_id = 5;
  string operation_id = 6;
  int64 timestamp_unix_nano = 7;
}

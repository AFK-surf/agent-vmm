syntax = "proto3";

package agentvmm.vmmd.v1;

import "internal/vmmd/v1/resources.proto";

option go_package = "github.com/AFK-surf/agent-vmm/internal/api/vmmd/v1;vmmdv1";

message ApplyNetworkLinkRequest {
  string request_id = 1;
  NetworkLink link = 2;
}

message ApplyNetworkLinkResponse {}

message DeleteNetworkLinkRequest {
  string request_id = 1;
  string link_id = 2;
}

message DeleteNetworkLinkResponse {}

message ApplyServiceProjectionRequest {
  string request_id = 1;
  ServiceProjection projection = 2;
}

message ApplyServiceProjectionResponse {
  string source_address = 1;
}

message DeleteServiceProjectionRequest {
  string request_id = 1;
  string projection_id = 2;
}

message DeleteServiceProjectionResponse {}

message ForwardTCPHeader {
  string actor_namespace_id = 1;
  string container_id = 2;
  uint32 port = 3;
  string container_instance_id = 4;
}

message ForwardTCPRequest {
  oneof event {
    ForwardTCPHeader header = 1;
    bytes data = 2;
    bool close_write = 3;
  }
}

message ForwardTCPResponse {
  oneof event {
    bytes data = 1;
    bool close_read = 2;
  }
}

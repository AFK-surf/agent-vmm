syntax = "proto3";

package agentvmm.vmmd.v1;

import "appliance/v1/appliance.proto";
import "google/protobuf/empty.proto";
import "internal/vmmd/v1/build.proto";
import "internal/vmmd/v1/container.proto";
import "internal/vmmd/v1/directory_sharing.proto";
import "internal/vmmd/v1/image.proto";
import "internal/vmmd/v1/namespace.proto";
import "internal/vmmd/v1/network.proto";
import "internal/vmmd/v1/resources.proto";
import "internal/vmmd/v1/system.proto";
import "internal/vmmd/v1/volume.proto";
import "internal/vmmd/v1/workspace.proto";

option go_package = "github.com/AFK-surf/agent-vmm/internal/api/vmmd/v1;vmmdv1";

service VMMDService {
  rpc Health(HealthRequest) returns (HealthResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc PrepareShutdown(PrepareShutdownRequest) returns (PrepareShutdownResponse);

  rpc StageApplianceContent(stream StageApplianceContentRequest) returns (agentvmm.appliance.v1.ApplianceContentStatus);
  rpc ReconcileSystemImages(ReconcileSystemImagesRequest) returns (ReconcileSystemImagesResponse);
  rpc EnsureSystemAppliance(EnsureSystemApplianceRequest) returns (SystemApplianceResponse);
  rpc StopSystemAppliance(StopSystemApplianceRequest) returns (SystemApplianceResponse);
  rpc DeleteSystemApplianceData(DeleteSystemApplianceDataRequest) returns (DeleteSystemApplianceDataResponse);
  rpc GetSystemAppliance(GetSystemApplianceRequest) returns (SystemApplianceResponse);
  rpc ListSystemAppliances(ListSystemAppliancesRequest) returns (ListSystemAppliancesResponse);
  rpc OpenSystemStream(stream SystemStreamFrame) returns (stream SystemStreamFrame);

  rpc EnsureNamespace(EnsureNamespaceRequest) returns (EnsureNamespaceResponse);
  rpc DeleteNamespace(DeleteNamespaceRequest) returns (DeleteNamespaceResponse);
  rpc DisposeNamespaceBatch(DisposeNamespaceBatchRequest) returns (DisposeNamespaceBatchResponse);
  rpc GetNamespace(GetNamespaceRequest) returns (GetNamespaceResponse);
  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse);
  rpc ApplyHostShares(ApplyHostSharesRequest) returns (ApplyHostSharesResponse);
  rpc GetNamespaceUsage(GetNamespaceUsageRequest) returns (GetUsageResponse);
  rpc GetSystemUsage(GetSystemUsageRequest) returns (GetUsageResponse);
  rpc PullImage(PullImageRequest) returns (stream PullImageResponse);
  rpc ImportImage(stream ImportImageRequest) returns (Image);

  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse);
  rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse);
  rpc GetVolume(GetVolumeRequest) returns (GetVolumeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetImage(GetImageRequest) returns (GetImageResponse);
  rpc ListImages(ListImagesRequest) returns (ListImagesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc DeleteImage(DeleteImageRequest) returns (DeleteImageResponse);

  rpc CreateContainer(CreateContainerRequest) returns (CreateContainerResponse);
  rpc StartContainer(StartContainerRequest) returns (StartContainerResponse);
  rpc StopContainer(StopContainerRequest) returns (StopContainerResponse);
  rpc WaitContainer(WaitContainerRequest) returns (WaitContainerResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc DeleteContainer(DeleteContainerRequest) returns (DeleteContainerResponse);
  rpc InspectContainer(InspectContainerRequest) returns (InspectContainerResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetContainerUsage(GetContainerUsageRequest) returns (GetUsageResponse);
  rpc Logs(LogsRequest) returns (stream LogsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc Exec(stream ExecRequest) returns (stream ExecResponse);
  rpc SignalContainer(SignalContainerRequest) returns (SignalContainerResponse);

  rpc ApplyNetworkLink(ApplyNetworkLinkRequest) returns (ApplyNetworkLinkResponse);
  rpc DeleteNetworkLink(DeleteNetworkLinkRequest) returns (DeleteNetworkLinkResponse);
  rpc ApplyServiceProjection(ApplyServiceProjectionRequest) returns (ApplyServiceProjectionResponse);
  rpc DeleteServiceProjection(DeleteServiceProjectionRequest) returns (DeleteServiceProjectionResponse);
  rpc ForwardTCP(stream ForwardTCPRequest) returns (stream ForwardTCPResponse);
  rpc BuildImage(stream BuildImageRequest) returns (stream BuildImageResponse);
  rpc CopyImage(CopyImageRequest) returns (Image);
  rpc ObserveImageOperation(ImageOperationRequest) returns (ImageOperationReceipt);
  rpc CancelImageOperation(ImageOperationRequest) returns (ImageOperationReceipt);
  rpc ForgetImageOperation(ImageOperationRequest) returns (google.protobuf.Empty);
  // BuildAppliance is reserved for the host operator. It runs the locked
  // BuildKit worker without importing the result into an environment.
  rpc BuildAppliance(stream BuildApplianceRequest) returns (stream BuildApplianceResponse);
  rpc ComponentHealth(ComponentHealthRequest) returns (ComponentHealthResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ProbeEgress(ProbeEgressRequest) returns (ProbeEgressResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc WatchEvents(WatchEventsRequest) returns (stream RuntimeEvent) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc StatWorkspace(WorkspacePathRequest) returns (WorkspaceEntry) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListWorkspace(ListWorkspaceRequest) returns (ListWorkspaceResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ReadWorkspace(ReadWorkspaceRequest) returns (stream ReadWorkspaceResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc WriteWorkspace(stream WriteWorkspaceRequest) returns (WriteWorkspaceResponse);
  rpc ArchiveWorkspace(ArchiveWorkspaceRequest) returns (stream ArchiveWorkspaceResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ExtractWorkspace(stream ExtractWorkspaceRequest) returns (WriteWorkspaceResponse);
}

syntax = "proto3";

package agentvmm.vmmd.v1;

import "internal/vmmd/v1/resources.proto";

option go_package = "github.com/AFK-surf/agent-vmm/internal/api/vmmd/v1;vmmdv1";

message EnsureNamespaceRequest {
  string request_id = 1;
  string namespace_id = 2;
  NamespaceLimits limits = 3;
  EgressMode egress_mode = 4;
}

message EnsureNamespaceResponse {
  Namespace namespace = 1;
}

message DeleteNamespaceRequest {
  string request_id = 1;
  string namespace_id = 2;
}

message DeleteNamespaceResponse {}

message GetNamespaceRequest {
  string namespace_id = 1;
}

message GetNamespaceResponse {
  Namespace namespace = 1;
}

message ListNamespacesRequest {}

message ListNamespacesResponse {
  repeated Namespace namespaces = 1;
}

message GetNamespaceUsageRequest {
  string namespace_id = 1;
}

message GetSystemUsageRequest {}

message DisposeNamespaceBatchRequest {
  string request_id = 1;
  string namespace_id = 2;
}

message DisposeNamespaceBatchResponse {
  bool complete = 1;
  string stage = 2;
}

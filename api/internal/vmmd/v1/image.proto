syntax = "proto3";

package agentvmm.vmmd.v1;

import "internal/vmmd/v1/resources.proto";

option go_package = "github.com/AFK-surf/agent-vmm/internal/api/vmmd/v1;vmmdv1";

message PullImageRequest {
  string request_id = 1;
  string actor_namespace_id = 2;
  string reference = 3;
}

message PullImageResponse {
  string status = 1;
  optional string digest = 2;
  uint64 logical_bytes = 3;
  string canonical_reference = 4;
}

message SystemImageRetention {
  uint64 installation_revision = 1;
  repeated string manifest_digests = 2;
}

message ReconcileSystemImagesRequest {
  string installation_id = 1;
  SystemImageRetention retention = 2;
  string request_id = 3;
}

message ReconcileSystemImagesResponse {}

message ImportImageHeader {
  string request_id = 1;
  string actor_namespace_id = 2;
  string image_reference = 3;
  bytes archive_sha256 = 4;
  string manifest_digest = 5;
  string platform = 6;
  uint64 archive_size = 7;
  bool system_import = 8;
  NamespaceLimits system_limits = 9;
  EgressMode system_egress_mode = 10;
  SystemImageRetention system_retention = 11;
}

message ImportImageRequest {
  oneof payload {
    ImportImageHeader header = 1;
    bytes archive_chunk = 2;
  }
}

message GetImageRequest {
  string actor_namespace_id = 1;
  string reference = 2;
}

message GetImageResponse {
  Image image = 1;
}

message ListImagesRequest {
  string actor_namespace_id = 1;
  uint32 limit = 2;
  string controller_cache_scope = 3;
}

message ListImagesResponse {
  repeated Image images = 1;
}

message DeleteImageRequest {
  string request_id = 1;
  string actor_namespace_id = 2;
  string reference = 3;
  string expected_generation_id = 4;
  string expected_digest = 5;
  string controller_cache_scope = 6;
}

message DeleteImageResponse {}

message ImageOperationRequest {
  string request_id = 1;
  ImageOperationKind kind = 2;
  string input_sha256 = 3;
  string execution_id = 4;
  string container_id = 5;
  string expected_instance_id = 6;
  string actor_namespace_id = 7;
}

syntax = "proto3";

package agentvmm.vmmd.v1;

import "google/rpc/status.proto";

option go_package = "github.com/AFK-surf/agent-vmm/internal/api/vmmd/v1;vmmdv1";

enum WorkspaceEntryKind {
  WORKSPACE_ENTRY_KIND_UNSPECIFIED = 0;
  WORKSPACE_ENTRY_KIND_FILE = 1;
  WORKSPACE_ENTRY_KIND_DIRECTORY = 2;
}

message WorkspaceEntry {
  string path = 1;
  WorkspaceEntryKind kind = 2;
  uint64 size = 3;
  uint32 mode = 4;
  int64 modified_unix_nanos = 5;
  bytes sha256 = 6;
}

enum SystemApplianceState {
  SYSTEM_APPLIANCE_STATE_UNSPECIFIED = 0;
  SYSTEM_APPLIANCE_STATE_STARTING = 1;
  SYSTEM_APPLIANCE_STATE_RUNNING = 2;
  SYSTEM_APPLIANCE_STATE_STOPPED = 3;
  SYSTEM_APPLIANCE_STATE_FAILED = 4;
  SYSTEM_APPLIANCE_STATE_SEALED = 5;
}

enum SystemStreamKind {
  SYSTEM_STREAM_KIND_UNSPECIFIED = 0;
  SYSTEM_STREAM_KIND_BOOTSTRAP = 1;
  SYSTEM_STREAM_KIND_CONTROLLER = 2;
  SYSTEM_STREAM_KIND_FRONTEND = 3;
}

message SystemApplianceIdentity {
  string installation_id = 1;
  string boot_id = 2;
  string namespace_id = 3;
  string container_id = 4;
  string container_instance_id = 5;
  string image_manifest_digest = 6;
  bytes boot_nonce = 7;
}

message SystemAppliance {
  SystemApplianceIdentity identity = 1;
  string data_volume_id = 2;
  reserved 3;
  reserved "data_volume_identity";
  SystemApplianceState state = 4;
  uint64 config_revision = 5;
  uint32 restart_count = 6;
  string status = 7;
  bytes bounded_log = 8;
  string network_subnet = 9;
}

enum EgressMode {
  EGRESS_MODE_UNSPECIFIED = 0;
  EGRESS_MODE_DENY_ALL = 1;
  EGRESS_MODE_PUBLIC_INTERNET = 2;
}

message NamespaceLimits {
  reserved 1, 2;
  reserved "cpu_millis", "memory_bytes";
  uint32 pids = 3;
  uint64 disk_bytes = 4;
}

message Namespace {
  string id = 1;
  NamespaceLimits limits = 2;
  EgressMode egress_mode = 3;
  uint32 project_id = 4;
  string subnet = 5;
  string observed_status = 6;
  reserved 7, 8, 9;
  reserved "resources_v2", "allocation_id", "generation";
}

message Volume {
  string id = 1;
  string namespace_id = 2;
  uint64 current_bytes = 3;
  uint64 limit_bytes = 4;
  repeated string mounted_by = 5;
  int64 usage_observed_at_unix_nano = 6;
  bool usage_stale = 7;
  string usage_unavailable_reason = 8;
  string generation_id = 9;
}

message ImageOperationReceipt {
  string request_id = 1;
  string input_sha256 = 2;
  ImageOperationKind kind = 3;
  ImageOperationState state = 4;
  bool writer_settled = 5;
  string execution_id = 6;
  string container_id = 7;
  string expected_instance_id = 8;
  string image_reference = 9;
  string manifest_digest = 10;
  google.rpc.Status status = 11;
  string runtime_instance_id = 13;
}

message Image {
  string reference = 1;
  string digest = 2;
  uint64 logical_bytes = 3;
  repeated string platforms = 4;
  string generation_id = 5;
  ImageOperationReceipt build_receipt = 6;
  ImageOperationReceipt copy_receipt = 7;
}

message ResourceLimits {
  reserved 1, 2;
  reserved "cpu_millis", "memory_bytes";
  optional uint32 pids = 3;
}

message VolumeMount {
  oneof source {
    string owned_volume = 1;
    string host_share = 4;
  }
  string destination = 2;
  bool read_only = 3;
}

enum ContainerState {
  CONTAINER_STATE_UNSPECIFIED = 0;
  CONTAINER_STATE_CREATED = 1;
  CONTAINER_STATE_RUNNING = 2;
  CONTAINER_STATE_STOPPED = 3;
  CONTAINER_STATE_UNKNOWN = 4;
}

message Container {
  string id = 1;
  string namespace_id = 2;
  string image = 3;
  ContainerState state = 4;
  optional uint32 exit_code = 5;
  repeated VolumeMount volumes = 6;
  repeated string argv = 7;
  repeated string env = 8;
  optional string workdir = 9;
  optional string user = 10;
  string instance_id = 11;
  int64 created_at_unix_nano = 12;
  int64 started_at_unix_nano = 13;
  int64 finished_at_unix_nano = 14;
  string generation_id = 15;
  string create_request_sha256 = 16;
  string start_request_sha256 = 17;
  string start_request_instance_id = 18;
  optional string configuration_fingerprint = 19;
}

message StringList {
  repeated string values = 1;
}

message Usage {
  uint64 cpu_nanos = 1;
  uint64 memory_bytes = 2;
  uint32 pids = 3;
  uint64 read_bytes = 4;
  uint64 write_bytes = 5;
  uint64 disk_bytes = 6;
  int64 sampled_at_unix_nano = 7;
  bool unavailable = 8;
  string unavailable_reason = 9;
  uint64 network_rx_bytes = 10;
  uint64 network_tx_bytes = 11;
}

message DiskAccounting {
  uint64 used_bytes = 1;
  uint64 capacity_bytes = 2;
  uint64 import_reservation_bytes = 3;
  uint64 system_reserve_bytes = 4;
  uint64 metadata_reserve_bytes = 5;
  optional uint64 image_runtime_bytes = 6;
  optional uint64 build_cache_bytes = 7;
  optional uint64 private_bytes = 8;
  optional uint64 other_bytes = 9;
  int64 breakdown_sampled_at_unix_nano = 10;
}

enum LogStream {
  LOG_STREAM_UNSPECIFIED = 0;
  LOG_STREAM_STDOUT = 1;
  LOG_STREAM_STDERR = 2;
}

enum ProcessSignal {
  PROCESS_SIGNAL_UNSPECIFIED = 0;
  PROCESS_SIGNAL_TERM = 1;
  PROCESS_SIGNAL_KILL = 2;
  PROCESS_SIGNAL_INT = 3;
}

message ContainerIDList {
  repeated string ids = 1;
}

message ContainerSelector {
  oneof selection {
    bool all_containers = 1;
    ContainerIDList container_ids = 2;
  }
}

message NetworkLink {
  string id = 1;
  string source_namespace_id = 2;
  string destination_namespace_id = 3;
  ContainerSelector source = 4;
  ContainerSelector destination = 5;
  repeated uint32 tcp_ports = 6;
  string dns_alias = 7;
}

message ServiceProjection {
  string id = 1;
  string source_namespace_id = 2;
  string source_container_id = 3;
  string source_container_instance_id = 4;
  string destination_namespace_id = 5;
  string destination_container_id = 6;
  string destination_container_instance_id = 7;
  uint32 destination_port = 8;
  string dns_alias = 9;
  int64 expires_unix_millis = 10;
  bool remote = 11;
  string virtual_address = 12;
}

enum BuildNetworkMode {
  BUILD_NETWORK_MODE_UNSPECIFIED = 0;
  BUILD_NETWORK_MODE_NONE = 1;
  BUILD_NETWORK_MODE_NAMESPACE_EGRESS = 2;
}

message BuildArgument {
  string name = 1;
  string value = 2;
}

message BuildSecret {
  string id = 1;
}

message BuildContextChunk {
  bytes data = 1;
  bool final = 2;
}

message BuildSecretChunk {
  string id = 1;
  bytes data = 2;
  bool final = 3;
}

enum ComponentState {
  COMPONENT_STATE_UNSPECIFIED = 0;
  COMPONENT_STATE_HEALTHY = 1;
  COMPONENT_STATE_DEGRADED = 2;
  COMPONENT_STATE_UNAVAILABLE = 3;
}

message ComponentStatus {
  string component = 1;
  ComponentState state = 2;
  string reason = 3;
  int64 observed_at_unix_nano = 4;
}

message ResourceReference {
  string kind = 1;
  string namespace_id = 2;
  string resource_id = 3;
}

enum ImageOperationKind {
  IMAGE_OPERATION_KIND_UNSPECIFIED = 0;
  IMAGE_OPERATION_KIND_BUILD = 1;
  IMAGE_OPERATION_KIND_COPY = 2;
}

enum ImageOperationState {
  IMAGE_OPERATION_STATE_UNSPECIFIED = 0;
  IMAGE_OPERATION_STATE_RUNNING = 1;
  IMAGE_OPERATION_STATE_SUCCEEDED = 2;
  IMAGE_OPERATION_STATE_FAILED = 3;
  IMAGE_OPERATION_STATE_STOPPED = 4;
  IMAGE_OPERATION_STATE_UNKNOWN = 5;
}

syntax = "proto3";

package agentvmm.vmmd.v1;

import "appliance/v1/appliance.proto";
import "internal/vmmd/v1/resources.proto";

option go_package = "github.com/AFK-surf/agent-vmm/internal/api/vmmd/v1;vmmdv1";

message HealthRequest {}

message HealthResponse {
  bool ready = 1;
  bool state_initialized = 2;
  bool root_read_only = 3;
  string boot_id = 4;
  map<string, string> runtime_versions = 6;
}

message PrepareShutdownRequest {
  string request_id = 1;
}

message PrepareShutdownResponse {}

message EnsureSystemApplianceRequest {
  reserved 4, 6, 7, 8;
  reserved "legacy_data_device_identifier", "data_volume_identity", "data_volume_key";
  reserved "initialize_data_volume";
  string request_id = 1;
  SystemApplianceIdentity identity = 2;
  // Read-only system images must contain direct directories /run/agent-vmm
  // and /var/lib/agent-vmm, and regular /etc/resolv.conf and /.agent-vmm-supervisor files. Their parent
  // components must be directories, not symlinks. Missing or invalid targets
  // fail before task start at stage system_mountpoints; image roots are never modified.
  string image_reference = 3;
  string data_volume_id = 5;
  NamespaceLimits limits = 9;
  EgressMode egress_mode = 10;
  uint64 config_revision = 11;
  uint64 data_volume_bytes = 12;
  bool lan_egress = 13;
  repeated agentvmm.appliance.v1.ApplianceContentReference content_refs = 14;
}

message StopSystemApplianceRequest {
  string request_id = 1;
  SystemApplianceIdentity identity = 2;
  uint32 timeout_seconds = 3;
}

message DeleteSystemApplianceDataRequest {
  string request_id = 1;
  string installation_id = 2;
  string data_volume_id = 3;
}

message DeleteSystemApplianceDataResponse {}

message GetSystemApplianceRequest {
  string installation_id = 1;
}

message ListSystemAppliancesRequest {
  string after_installation_id = 1;
  uint32 limit = 2;
}

message SystemApplianceResponse {
  SystemAppliance appliance = 1;
}

message ListSystemAppliancesResponse {
  repeated SystemAppliance appliances = 1;
  string next_cursor = 2;
}

message SystemStreamHeader {
  reserved 9;
  reserved "max_use_count";
  SystemApplianceIdentity identity = 1;
  SystemStreamKind kind = 2;
  string name = 3;
  bytes nonce = 4;
  uint32 max_frame_bytes = 5;
  // Required for Bootstrap and Frontend. Controller forbids a lifetime byte limit.
  uint64 max_total_bytes = 6;
  uint32 idle_seconds = 7;
  uint32 max_concurrent_streams = 8;
}

message SystemStreamFrame {
  oneof payload {
    SystemStreamHeader header = 1;
    bytes data = 2;
    bool close_write = 3;
  }
}

message ComponentHealthRequest {}

message ComponentHealthResponse {
  repeated ComponentStatus components = 1;
}

message ProbeEgressRequest {
  string namespace_id = 1;
}

message ProbeEgressResponse {
  bool policy_enforced = 1;
  bool dns_ok = 2;
  bool tcp_ok = 3;
  bool private_denied = 4;
  string failure_layer = 5;
  string reason = 6;
}

message WatchEventsRequest {
  uint64 after_sequence = 1;
}

message RuntimeEvent {
  uint64 sequence = 1;
  string type = 2;
  ResourceReference resource = 3;
  string guest_boot_id = 4;
  string request_id = 5;
  string operation_id = 6;
  int64 timestamp_unix_nano = 7;
}

message StageApplianceContentRequest {
  oneof payload {
    agentvmm.appliance.v1.StageContentHeader header = 1;
    bytes archive_chunk = 2;
  }
}

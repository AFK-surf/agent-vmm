syntax = "proto3";

package agentvmm.remote.v1;

import "host/v1/host.proto";
import "trust/v1/trust.proto";

option go_package = "github.com/AFK-surf/agent-vmm/api/remote/v1;remotev1";

service RemoteControllerService {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  rpc Connect(stream HostControlMessage) returns (stream ControllerControlMessage);
  rpc ServeSession(stream HostSessionFrame) returns (stream ControllerSessionFrame);
  rpc ServeFrontend(stream agentvmm.host.v1.HostFrontendFrame) returns (stream agentvmm.host.v1.ControllerFrontendFrame);
}

message EnrollRequest {
  string protocol_version = 1;
  string registration_id = 2;
  bytes enrollment_token = 3;
  string endpoint_identity = 4;
  string connector_release = 5;
  repeated string supported_features = 6;
  repeated string required_features = 7;
  agentvmm.trust.v1.DeviceIdentity device_identity = 8;
}

message EnrollResponse {
  string protocol_version = 1;
  string registration_id = 2;
  string controller_display_name = 3;
  bytes credential = 4;
  repeated string enabled_features = 5;
  agentvmm.trust.v1.TrustAnchor trust_anchor = 6;
  agentvmm.trust.v1.MembershipCredential membership_credential = 7;
}

message HostControlMessage {
  oneof payload {
    HostHello hello = 1;
    CommandResult result = 2;
    HostEvent event = 3;
    CommandAck ack = 4;
    CommandEvidence evidence = 5;
    EndpointObservationRenewal endpoint_observation_renewal = 6;
    agentvmm.host.v1.HostLoopbackFrontendEvent frontend_event = 7;
    RemoteObservationRenewal observation_renewal = 8;
  }
}

message EndpointObservationRenewal {
  uint64 connection_epoch = 1;
  agentvmm.trust.v1.EndpointObservation endpoint_observation = 2;
}

message RemoteObservationRenewal {
  uint64 connection_epoch = 1;
  RemoteObservationSnapshot observation = 2;
}

message HostHello {
  string protocol_version = 1;
  string host_api_version = 2;
  string connector_release = 3;
  string registration_id = 4;
  string connection_instance = 5;
  uint64 pool_revision = 6;
  Capacity capacity = 7;
  repeated Allocation inventory = 8;
  HostHealth health = 9;
  uint64 connection_epoch = 10;
  uint64 inventory_watermark = 11;
  uint64 acknowledged_controller_sequence = 12;
  repeated string supported_features = 13;
  repeated string required_features = 14;
  agentvmm.trust.v1.EndpointObservation endpoint_observation = 15;
  agentvmm.host.v1.HostLoopbackFrontendCapacity host_loopback_frontend = 16;
  RemoteObservationSnapshot observation = 17;
}

message RemoteObservationSnapshot {
  uint64 sequence = 1;
  int64 observed_unix_millis = 2;
  string protocol_version = 3;
  string host_api_version = 4;
  string connector_release = 5;
  repeated string supported_features = 6;
  Capacity capacity = 7;
  RemoteObservationHealth health = 8;
  RemoteObservationUsage usage = 9;
  uint64 inventory_watermark = 10;
  uint32 inventory_count = 11;
  int64 inventory_observed_unix_millis = 12;
  RemoteGuestDiskBudget disk_budget = 13;
}

message RemoteGuestDiskBudget {
  uint64 capacity_bytes = 1;
  uint64 used_bytes = 2;
  uint64 writable_headroom_bytes = 3;
  uint64 import_reservation_bytes = 4;
  uint64 system_reserve_bytes = 5;
  uint64 available_bytes = 6;
  uint64 allocation_unit_bytes = 7;
  uint32 namespace_count = 8;
  uint32 active_import_reservations = 9;
}

message RemoteObservationHealth {
  string status = 1;
  string issue = 2;
  string message = 3;
  repeated RemoteObservationComponent components = 4;
}

message RemoteObservationComponent {
  string component = 1;
  string status = 2;
}

message RemoteObservationUsage {
  uint64 cpu_nanos = 1;
  uint64 memory_bytes = 2;
  uint32 pids = 3;
  uint64 read_bytes = 4;
  uint64 write_bytes = 5;
  uint64 disk_bytes = 6;
  uint64 network_rx_bytes = 7;
  uint64 network_tx_bytes = 8;
  int64 sampled_unix_millis = 9;
  bool stale = 10;
  string issue = 11;
}

message Capacity {
  uint32 max_environments = 1;
  agentvmm.host.v1.ResourceLimits aggregate_limits = 2;
  agentvmm.host.v1.ResourceLimits per_environment_limits = 3;
  agentvmm.host.v1.EgressMode max_egress_mode = 4;
  uint32 max_lease_seconds = 5;
  uint32 disconnect_grace_seconds = 6;
}

message Allocation {
  string allocation_id = 1;
  string display_label = 2;
  agentvmm.host.v1.ResourceLimits limits = 3;
  agentvmm.host.v1.EgressMode egress_mode = 4;
  uint64 revision = 5;
  agentvmm.host.v1.AllocationState state = 6;
  Lease lease = 7;
  uint64 generation = 8;
  agentvmm.host.v1.WorkloadResourcesV2 resources_v2 = 9;
}

message Lease {
  string lease_id = 1;
  string allocation_id = 2;
  string workload_ref = 3;
  uint64 generation = 4;
  int64 expires_unix_millis = 5;
  agentvmm.host.v1.LeaseState state = 6;
  uint64 allocation_revision = 7;
}

message HostHealth {
  bool runtime_ready = 1;
  bool network_ready = 2;
  string status = 3;
}

message ControllerControlMessage {
  oneof payload {
    ControllerCommand command = 1;
    RotateCredential rotate_credential = 2;
    RevokeCredential revoke_credential = 3;
    ControllerReady controller_ready = 4;
  }
}

message ControllerReady {
  string registration_id = 1;
  uint64 connection_epoch = 2;
  uint64 acknowledged_inventory_watermark = 3;
  repeated string enabled_features = 4;
}

message ControllerCommand {
  string command_id = 1;
  uint64 sequence = 2;
  uint64 connection_epoch = 3;
  int64 deadline_unix_millis = 4;
  uint64 target_revision = 5;
  uint64 lease_generation = 6;
  uint64 acknowledged_host_sequence = 7;
  oneof command {
    EnsureAllocation ensure_allocation = 10;
    ReleaseAllocation release_allocation = 11;
    PlanCleanupAllocation plan_cleanup_allocation = 12;
    ExecuteCleanupAllocation execute_cleanup_allocation = 13;
    AcquireLease acquire_lease = 14;
    RenewLease renew_lease = 15;
    ReleaseLease release_lease = 16;
    DrainRegistration drain_registration = 17;
    OpenSession open_session = 18;
    AcquireHostLoopbackFrontend acquire_host_loopback_frontend = 19;
    RenewHostLoopbackFrontend renew_host_loopback_frontend = 20;
    ReleaseHostLoopbackFrontend release_host_loopback_frontend = 21;
  }
}

message AcquireHostLoopbackFrontend {
  string allocation_id = 1;
  string allocation_lease_id = 2;
  uint64 allocation_lease_generation = 3;
  string assignment_id = 4;
  uint32 duration_seconds = 5;
}
message RenewHostLoopbackFrontend {
  string frontend_lease_id = 1;
  uint64 generation = 2;
  string allocation_lease_id = 3;
  uint64 allocation_lease_generation = 4;
  uint32 duration_seconds = 5;
}
message ReleaseHostLoopbackFrontend {
  string frontend_lease_id = 1;
  uint64 generation = 2;
}

message EnsureAllocation {
  string allocation_id = 1;
  string display_label = 2;
  agentvmm.host.v1.ResourceLimits limits = 3;
  agentvmm.host.v1.EgressMode egress_mode = 4;
  uint64 policy_revision = 5;
  uint64 generation = 6;
  agentvmm.host.v1.WorkloadResourcesV2 resources_v2 = 7;
}
message ReleaseAllocation {
  string allocation_id = 1;
  uint64 expected_revision = 2;
  uint64 expected_generation = 3;
}
message PlanCleanupAllocation {
  string allocation_id = 1;
  agentvmm.host.v1.CleanupKind kind = 2;
}
message ExecuteCleanupAllocation {
  string allocation_id = 1;
  uint64 plan_revision = 2;
  repeated string confirmed_volume_ids = 3;
  agentvmm.host.v1.CleanupKind kind = 4;
  string expected_lease_id = 5;
  uint64 expected_lease_generation = 6;
}
message AcquireLease {
  string allocation_id = 1;
  uint32 duration_seconds = 2;
  string workload_ref = 3;
}
message RenewLease {
  string lease_id = 1;
  uint64 generation = 2;
  uint32 duration_seconds = 3;
}
message ReleaseLease {
  string lease_id = 1;
  uint64 generation = 2;
}
message DrainRegistration {}
message OpenSession {
  string allocation_id = 1;
  string lease_id = 2;
  uint64 generation = 3;
}

message CommandResult {
  string command_id = 1;
  CommandOutcome outcome = 2;
  ErrorReason reason = 3;
  string message = 4;
  oneof result {
    Allocation allocation = 5;
    Lease lease = 6;
    CleanupPlan cleanup_plan = 7;
    SessionReady session_ready = 8;
    agentvmm.host.v1.HostLoopbackFrontendLease host_loopback_frontend_lease = 12;
  }
  uint64 sequence = 9;
  uint64 connection_epoch = 10;
  uint64 inventory_watermark = 11;
  CapacityDimension capacity_dimension = 13;
}

enum CapacityDimension {
  CAPACITY_DIMENSION_UNSPECIFIED = 0;
  CAPACITY_DIMENSION_CPU_GUARANTEE = 1;
  CAPACITY_DIMENSION_CPU_MAX = 2;
  CAPACITY_DIMENSION_MEMORY = 3;
  CAPACITY_DIMENSION_PIDS = 4;
  CAPACITY_DIMENSION_WRITABLE = 5;
  CAPACITY_DIMENSION_STORAGE_HEADROOM = 6;
  CAPACITY_DIMENSION_IMPORT_SLOT = 7;
}

enum CommandAckDisposition {
  COMMAND_ACK_DISPOSITION_UNSPECIFIED = 0;
  COMMAND_ACK_DISPOSITION_ADMITTED = 1;
  COMMAND_ACK_DISPOSITION_REJECTED = 2;
  COMMAND_ACK_DISPOSITION_DUPLICATE = 3;
}

message CommandAck {
  string command_id = 1;
  uint64 sequence = 2;
  uint64 connection_epoch = 3;
  CommandAckDisposition disposition = 4;
  ErrorReason reason = 5;
  string message = 6;
}

enum ExecutionStage {
  EXECUTION_STAGE_UNSPECIFIED = 0;
  EXECUTION_STAGE_STARTED = 1;
  EXECUTION_STAGE_FINISHED = 2;
}

message CommandEvidence {
  string command_id = 1;
  uint64 sequence = 2;
  uint64 connection_epoch = 3;
  ExecutionStage stage = 4;
  int64 observed_unix_millis = 5;
}

enum CommandOutcome {
  COMMAND_OUTCOME_UNSPECIFIED = 0;
  COMMAND_OUTCOME_SUCCEEDED = 1;
  COMMAND_OUTCOME_REJECTED = 2;
  COMMAND_OUTCOME_UNKNOWN = 3;
}

enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  ERROR_REASON_INVALID_ARGUMENT = 1;
  ERROR_REASON_UNAUTHENTICATED = 2;
  ERROR_REASON_VERSION_MISMATCH = 3;
  ERROR_REASON_REGISTRATION_MISMATCH = 4;
  ERROR_REASON_POLICY_CONFLICT = 5;
  ERROR_REASON_CAPACITY_EXHAUSTED = 6;
  ERROR_REASON_ALLOCATION_NOT_FOUND = 7;
  ERROR_REASON_LEASE_CONFLICT = 8;
  ERROR_REASON_LEASE_REVOKED = 9;
  ERROR_REASON_STALE_REVISION = 10;
  ERROR_REASON_UNAVAILABLE = 11;
  ERROR_REASON_INTERNAL = 12;
  ERROR_REASON_STALE_CONNECTION_EPOCH = 13;
  ERROR_REASON_SEQUENCE_CONFLICT = 14;
  ERROR_REASON_DEADLINE_EXCEEDED = 15;
  ERROR_REASON_FEATURE_MISMATCH = 16;
}

message CleanupPlan {
  string allocation_id = 1;
  uint64 revision = 2;
  repeated string volume_ids = 3;
  agentvmm.host.v1.CleanupKind kind = 4;
  repeated agentvmm.host.v1.CleanupImpact impacts = 5;
}
message SessionReady {
  string allocation_id = 1;
  string lease_id = 2;
  uint64 generation = 3;
  string tunnel_nonce = 4;
}
message HostEvent {
  string kind = 1;
  string allocation_id = 2;
  string lease_id = 3;
  string status = 4;
  uint64 sequence = 5;
  uint64 connection_epoch = 6;
  uint64 inventory_watermark = 7;
}
message RotateCredential { bytes credential = 1; }
message RevokeCredential { string reason = 1; }

message SessionHeader {
  string protocol_version = 1;
  string registration_id = 2;
  string allocation_id = 3;
  string lease_id = 4;
  uint64 generation = 5;
  string tunnel_nonce = 6;
  uint32 frame_bytes = 7;
  uint32 max_in_flight_bytes = 8;
  uint64 connection_epoch = 9;
}
message HostSessionFrame {
  oneof payload {
    SessionHeader header = 1;
    bytes data = 2;
    bool close_write = 3;
  }
}
message ControllerSessionFrame {
  oneof payload {
    bytes data = 1;
    bool close_write = 2;
  }
}

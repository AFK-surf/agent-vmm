syntax = "proto3";

package agentvmm.trust.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/AFK-surf/agent-vmm/api/trust/v1;trustv1";

// TrustService is the connector-only local surface. It signs and verifies
// bounded trust artifacts; it never exposes a device root private key.
service TrustService {
  rpc GetDeviceIdentity(GetDeviceIdentityRequest) returns (DeviceIdentity);
  rpc SignEndpointObservation(SignEndpointObservationRequest) returns (EndpointObservation);
  rpc ApplyMeshEndpointObservation(ApplyMeshEndpointObservationRequest) returns (EndpointObservation);
  rpc GetEndpointObservation(GetEndpointObservationRequest) returns (EndpointObservation);
  rpc ListPersonalMeshes(ListPersonalMeshesRequest) returns (ListPersonalMeshesResponse);
  rpc InstallManagedTrust(InstallManagedTrustRequest) returns (InstallManagedTrustResponse);
  rpc ApplyMeshSnapshot(ApplyMeshSnapshotRequest) returns (ApplyMeshSnapshotResponse);
  rpc AuthorizeRoute(AuthorizeRouteRequest) returns (AuthorizeRouteResponse);
  rpc PullRegistryOperations(PullRegistryOperationsRequest) returns (PullRegistryOperationsResponse);
  rpc CommitRegistryOperation(CommitRegistryOperationRequest) returns (ApplyMeshSnapshotResponse);
}

// PersonalMeshRegistryService is provider-neutral. Registry implementations
// linearize device-signed operations but never become route issuers.
service PersonalMeshRegistryService {
  rpc CreateMesh(CreateMeshRequest) returns (MeshCommitResponse);
  rpc CommitJoin(CommitJoinRequest) returns (MeshCommitResponse);
  rpc CommitRevoke(CommitRevokeRequest) returns (MeshCommitResponse);
  rpc GetSnapshot(GetSnapshotRequest) returns (MeshSnapshot);
  rpc PublishEndpoint(PublishEndpointRequest) returns (PublishEndpointResponse);
  rpc ListEndpoints(ListMeshEndpointsRequest) returns (ListMeshEndpointsResponse);
  rpc WatchRevision(WatchRevisionRequest) returns (stream RevisionNotice);
}

enum SignatureSuite {
  SIGNATURE_SUITE_UNSPECIFIED = 0;
  SIGNATURE_SUITE_P256_SHA256 = 1;
}

enum AuthorityClass {
  AUTHORITY_CLASS_UNSPECIFIED = 0;
  AUTHORITY_CLASS_MANAGED_CONTROLLER = 1;
  AUTHORITY_CLASS_PERSONAL_MESH = 2;
}

enum CapabilityKind {
  CAPABILITY_KIND_UNSPECIFIED = 0;
  CAPABILITY_KIND_SERVICE_ROUTE = 1;
  CAPABILITY_KIND_MESH_CONTROL = 2;
}

enum MeshPermission {
  MESH_PERMISSION_UNSPECIFIED = 0;
  MESH_PERMISSION_USE_SERVICES = 1;
  MESH_PERMISSION_MANAGE_MEMBERS = 2;
}

enum MeshMembershipState {
  MESH_MEMBERSHIP_STATE_UNSPECIFIED = 0;
  MESH_MEMBERSHIP_STATE_PENDING_JOIN = 1;
  MESH_MEMBERSHIP_STATE_ACTIVE = 2;
  MESH_MEMBERSHIP_STATE_REVOKED = 3;
}

enum RegistryOperationKind {
  REGISTRY_OPERATION_KIND_UNSPECIFIED = 0;
  REGISTRY_OPERATION_KIND_GENESIS = 1;
  REGISTRY_OPERATION_KIND_JOIN = 2;
  REGISTRY_OPERATION_KIND_REVOKE = 3;
}

enum PairingRole {
  PAIRING_ROLE_UNSPECIFIED = 0;
  PAIRING_ROLE_MANAGER = 1;
  PAIRING_ROLE_JOINER = 2;
}

message DeviceIdentity {
  string device_id = 1;
  bytes root_public_key = 2;
  uint64 root_key_revision = 3;
  SignatureSuite signature_suite = 4;
}

message DeviceRootRotation {
  string device_id = 1;
  uint64 old_root_key_revision = 2;
  bytes old_root_public_key = 3;
  uint64 new_root_key_revision = 4;
  bytes new_root_public_key = 5;
  bytes old_signs_new = 6;
  bytes new_signs_old = 7;
  google.protobuf.Timestamp rotated_at = 8;
}

message AuthorityDescriptor {
  string authority_id = 1;
  AuthorityClass authority_class = 2;
  string key_id = 3;
  bytes trust_domain_ref = 4;
  uint64 revision = 5;
}

message VerificationKey {
  string key_id = 1;
  bytes public_key = 2;
  SignatureSuite signature_suite = 3;
}

message TrustAnchor {
  AuthorityDescriptor authority = 1;
  repeated VerificationKey verification_keys = 2;
  repeated CapabilityKind allowed_capability_kinds = 3;
  google.protobuf.Timestamp not_before = 4;
  google.protobuf.Timestamp not_after = 5;
  uint64 revision = 6;
  reserved 7;
  reserved "signature";
}

message MembershipCredential {
  AuthorityDescriptor authority = 1;
  string subject_device_id = 2;
  uint64 subject_root_key_revision = 3;
  bytes opaque_claims_digest = 4;
  uint64 policy_revision = 5;
  google.protobuf.Timestamp expires_at = 6;
  bytes signature = 7;
  bytes subject_root_public_key = 8;
}

message PersonalMeshDescriptor {
  string mesh_id = 1;
  string genesis_device_id = 2;
  bytes genesis_root_public_key = 3;
  string registry_audience = 4;
  uint64 policy_epoch = 5;
  google.protobuf.Timestamp created_at = 6;
  bytes genesis_signature = 7;
}

message MeshMembership {
  string mesh_id = 1;
  string device_id = 2;
  bytes root_public_key = 3;
  uint64 root_key_revision = 4;
  repeated MeshPermission permissions = 5;
  MeshMembershipState state = 6;
  uint64 joined_at_revision = 7;
  optional uint64 revoked_at_revision = 8;
  bytes operation_digest = 9;
  repeated bytes signatures = 10;
}

message MeshTombstone {
  string device_id = 1;
  uint64 root_key_revision = 2;
  uint64 revoked_at_revision = 3;
  uint64 policy_epoch = 4;
  bytes operation_digest = 5;
}

message RegistryReceipt {
  string registry_audience = 1;
  string mesh_id = 2;
  uint64 revision = 3;
  uint64 policy_epoch = 4;
  bytes snapshot_digest = 5;
  google.protobuf.Timestamp issued_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  string key_id = 8;
  bytes signature = 9;
}

message MeshSnapshot {
  string mesh_id = 1;
  uint64 revision = 2;
  uint64 policy_epoch = 3;
  bytes previous_digest = 4;
  repeated MeshMembership active_members = 5;
  repeated MeshTombstone tombstones = 6;
  bytes snapshot_digest = 7;
  google.protobuf.Timestamp issued_at = 8;
  google.protobuf.Timestamp expires_at = 9;
  RegistryReceipt registry_receipt = 10;
}

message EndpointObservation {
  string device_id = 1;
  uint64 root_key_revision = 2;
  bytes endpoint_node_id = 3;
  uint64 endpoint_generation = 4;
  repeated string supported_alpns = 5;
  repeated string feature_set = 6;
  bytes observed_addresses_digest = 7;
  google.protobuf.Timestamp expires_at = 8;
  bytes device_signature = 9;
}

// PairingProof is signed by the device root named in the PAKE-bound context.
// It is exchanged only after PAKE key confirmation and is single-use through
// session_id/invite_revision plus the registry operation CAS.
message PairingProof {
  bytes session_id = 1;
  string mesh_id = 2;
  uint64 invite_revision = 3;
  PairingRole role = 4;
  string device_id = 5;
  uint64 root_key_revision = 6;
  bytes root_public_key = 7;
  repeated MeshPermission permissions = 8;
  bytes context_digest = 9;
  google.protobuf.Timestamp expires_at = 10;
  bytes signature = 11;
}

message RouteBudget {
  uint32 connection_limit = 1;
  uint64 byte_limit = 2;
  uint32 concurrency_limit = 3;
}

message RouteCapability {
  string capability_id = 1;
  AuthorityDescriptor authority = 2;
  string source_device_id = 3;
  optional string source_allocation_id = 4;
  string destination_device_id = 5;
  string destination_export_id = 6;
  string allowed_protocol = 7;
  repeated string allowed_verbs = 8;
  uint64 route_generation = 9;
  uint64 policy_revision = 10;
  RouteBudget budget = 11;
  google.protobuf.Timestamp not_before = 12;
  google.protobuf.Timestamp expires_at = 13;
  bytes nonce = 14;
  string audience = 15;
  string issuer_key_id = 16;
  bytes signature = 17;
  string issuer_device_id = 18;
  string route_class = 19;
  MembershipCredential source_membership_credential = 20;
}

message RegistryOperation {
  string operation_id = 1;
  RegistryOperationKind kind = 2;
  string mesh_id = 3;
  uint64 expected_revision = 4;
  uint64 policy_epoch = 5;
  string issuer_device_id = 6;
  uint64 issuer_root_key_revision = 7;
  MeshMembership membership = 8;
  string invite_id = 9;
  google.protobuf.Timestamp expires_at = 10;
  bytes nonce = 11;
  bytes signature = 12;
  bytes pairing_proof = 13;
}

message GetDeviceIdentityRequest {}

message SignEndpointObservationRequest {
  EndpointObservation unsigned_observation = 1;
}

message ApplyMeshEndpointObservationRequest {
  string mesh_id = 1;
  EndpointObservation observation = 2;
}

message GetEndpointObservationRequest { string device_id = 1; }

message ListPersonalMeshesRequest {}

message PersonalMeshState {
  PersonalMeshDescriptor mesh_descriptor = 1;
  MeshSnapshot snapshot = 2;
}

message ListPersonalMeshesResponse { repeated PersonalMeshState meshes = 1; }

message InstallManagedTrustRequest {
  TrustAnchor trust_anchor = 1;
  MembershipCredential membership_credential = 2;
}

message InstallManagedTrustResponse {
  string authority_id = 1;
  uint64 anchor_revision = 2;
  uint64 policy_revision = 3;
}

message ApplyMeshSnapshotRequest {
  MeshSnapshot snapshot = 1;
  uint64 expected_revision = 2;
}

message ApplyMeshSnapshotResponse {
  uint64 applied_revision = 1;
}

message AuthorizeRouteRequest {
  RouteCapability capability = 1;
  string expected_audience = 2;
  google.protobuf.Timestamp observed_at = 3;
  string expected_source_device_id = 4;
  optional string expected_source_allocation_id = 5;
  string expected_destination_device_id = 6;
  string expected_destination_export_id = 7;
  uint64 expected_route_generation = 8;
  uint64 expected_policy_revision = 9;
  string expected_route_class = 10;
}

message AuthorizeRouteResponse {
  bool authorized = 1;
  string denial_code = 2;
  RouteBudget remaining_budget = 3;
}

message PendingRegistryOperation {
  uint64 sequence = 1;
  RegistryOperation operation = 2;
  PersonalMeshDescriptor mesh_descriptor = 3;
}

message PullRegistryOperationsRequest {
  uint64 after_sequence = 1;
  uint32 limit = 2;
}

message PullRegistryOperationsResponse {
  repeated PendingRegistryOperation operations = 1;
}

message CommitRegistryOperationRequest {
  string operation_id = 1;
  MeshSnapshot snapshot = 2;
}

message CreateMeshRequest {
  PersonalMeshDescriptor mesh_descriptor = 1;
  RegistryOperation genesis = 2;
}

message CommitJoinRequest {
  RegistryOperation operation = 1;
}

message CommitRevokeRequest {
  RegistryOperation operation = 1;
}

message MeshCommitResponse {
  MeshSnapshot snapshot = 1;
}

message GetSnapshotRequest {
  string mesh_id = 1;
  uint64 minimum_revision = 2;
}

message PublishEndpointRequest {
  string mesh_id = 1;
  uint64 expected_revision = 2;
  EndpointObservation observation = 3;
}

message PublishEndpointResponse {
  RegistryReceipt receipt = 1;
}

message ListMeshEndpointsRequest {
  string mesh_id = 1;
  uint64 expected_revision = 2;
}

message ListMeshEndpointsResponse {
  repeated EndpointObservation observations = 1;
  uint64 mesh_revision = 2;
}

message WatchRevisionRequest {
  string mesh_id = 1;
  uint64 after_revision = 2;
}

message RevisionNotice {
  string mesh_id = 1;
  uint64 revision = 2;
}

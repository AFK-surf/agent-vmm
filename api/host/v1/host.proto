syntax = "proto3";

package agentvmm.host.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "service/v1/service.proto";
import "trust/v1/trust.proto";

option go_package = "github.com/AFK-surf/agent-vmm/api/host/v1;hostv1";

service AgentRuntimeService {
  rpc GetEnvironment(GetOwnEnvironmentRequest) returns (GetEnvironmentResponse);
  rpc PullImage(PullImageRequest) returns (stream PullImageResponse);
  rpc ImportImage(stream ImportImageRequest) returns (Image);
  rpc ListImages(ListImagesRequest) returns (ListImagesResponse);
  rpc DeleteImage(DeleteImageRequest) returns (google.protobuf.Empty);
  rpc CreateContainer(CreateContainerRequest) returns (ContainerResponse);
  rpc StartContainer(ContainerMutationRequest) returns (ContainerResponse);
  rpc StopContainer(StopContainerRequest) returns (ContainerResponse);
  rpc AcquireExecution(ExecutionRequest) returns (ExecutionResponse);
  rpc ReleaseExecution(ExecutionRequest) returns (google.protobuf.Empty);
  rpc QuiesceContainer(QuiesceContainerRequest) returns (ContainerResponse);
  rpc WaitContainer(ContainerRequest) returns (WaitContainerResponse);
  rpc DeleteContainer(ContainerMutationRequest) returns (google.protobuf.Empty);
  rpc GetContainer(ContainerRequest) returns (ContainerResponse);
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse);
  rpc Logs(LogsRequest) returns (stream LogRecord);
  rpc Exec(stream ExecRequest) returns (stream ExecResponse);
  rpc SignalContainer(SignalContainerRequest) returns (google.protobuf.Empty);
  rpc CreateVolume(CreateVolumeRequest) returns (VolumeResponse);
  rpc DeleteVolume(DeleteVolumeRequest) returns (google.protobuf.Empty);
  rpc GetVolume(VolumeRequest) returns (VolumeResponse);
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);
  rpc ForwardTCP(stream ForwardTCPRequest) returns (stream ForwardTCPResponse);
  rpc BuildImage(stream BuildImageRequest) returns (stream BuildImageResponse);
  rpc ReleaseSession(ReleaseSessionRequest) returns (google.protobuf.Empty);
  rpc PlanResetEnvironment(GetOwnEnvironmentRequest) returns (CleanupPlanResponse);
  rpc PlanDiscardEnvironment(GetOwnEnvironmentRequest) returns (CleanupPlanResponse);
  rpc RequestReset(EnvironmentOperationRequest) returns (OperationResponse);
  rpc RequestDiscard(EnvironmentOperationRequest) returns (OperationResponse);
  rpc StatWorkspace(WorkspacePathRequest) returns (WorkspaceEntry);
  rpc ListWorkspace(ListWorkspaceRequest) returns (ListWorkspaceResponse);
  rpc ReadWorkspace(ReadWorkspaceRequest) returns (stream ReadWorkspaceResponse);
  rpc WriteWorkspace(stream WriteWorkspaceRequest) returns (WriteWorkspaceResponse);
  rpc ArchiveWorkspace(ArchiveWorkspaceRequest) returns (stream ArchiveWorkspaceResponse);
  rpc ExtractWorkspace(stream ExtractWorkspaceRequest) returns (WriteWorkspaceResponse);
  rpc CreateServiceExport(CreateServiceExportRequest) returns (agentvmm.service.v1.ServiceExport);
  rpc ListServiceExports(ListOwnServiceExportsRequest) returns (agentvmm.service.v1.ListServiceExportsResponse);
  rpc GetServiceExport(GetOwnServiceExportRequest) returns (agentvmm.service.v1.ServiceExport);
  rpc RevokeServiceExport(RevokeOwnServiceExportRequest) returns (google.protobuf.Empty);
  rpc CreateServiceImport(CreateServiceImportRequest) returns (agentvmm.service.v1.ServiceImport);
  rpc CreatePersonalServiceImport(CreatePersonalServiceImportRequest) returns (agentvmm.service.v1.ServiceImport);
  rpc ListServiceImports(ListServiceImportsRequest) returns (ListServiceImportsResponse);
  rpc GetServiceImport(GetServiceImportRequest) returns (agentvmm.service.v1.ServiceImport);
  rpc RevokeServiceImport(RevokeServiceImportRequest) returns (google.protobuf.Empty);
}

service OperatorService {
  rpc StartVM(StartVMRequest) returns (OperationResponse);
  rpc GetVM(GetVMRequest) returns (VMResponse);
  rpc StopVM(StopVMRequest) returns (OperationResponse);
  rpc CreateAgentSession(CreateAgentSessionRequest) returns (CreateAgentSessionResponse);
  rpc RevokeAgentSession(RevokeAgentSessionRequest) returns (google.protobuf.Empty);
  rpc ListAgentIntegrations(ListAgentIntegrationsRequest) returns (ListAgentIntegrationsResponse);
  rpc PrepareAgentIntegration(PrepareAgentIntegrationRequest) returns (AgentIntegrationResponse);
  rpc BeginAgentIntegrationConfiguration(BeginAgentIntegrationConfigurationRequest) returns (AgentIntegrationResponse);
  rpc CommitAgentIntegration(CommitAgentIntegrationRequest) returns (AgentIntegrationResponse);
  rpc FailAgentIntegration(FailAgentIntegrationRequest) returns (AgentIntegrationResponse);
  rpc BeginAgentIntegrationRemoval(BeginAgentIntegrationRemovalRequest) returns (AgentIntegrationResponse);
  rpc CompleteAgentIntegrationRemoval(CompleteAgentIntegrationRemovalRequest) returns (AgentIntegrationResponse);
  rpc ListAgentSessions(ListAgentSessionsRequest) returns (ListAgentSessionsResponse);
  rpc RevokeAgentSessions(RevokeAgentSessionsRequest) returns (google.protobuf.Empty);
  rpc GetSystemSnapshot(GetSystemSnapshotRequest) returns (GetSystemSnapshotResponse);
  rpc ListEnvironments(ListEnvironmentsRequest) returns (ListEnvironmentsResponse);
  rpc GetEnvironment(GetEnvironmentRequest) returns (GetEnvironmentResponse);
  rpc ListEnvironmentImages(ListEnvironmentImagesRequest) returns (ListImagesResponse);
  rpc DeleteEnvironmentImage(DeleteEnvironmentImageRequest) returns (google.protobuf.Empty);
  rpc WatchEvents(WatchEventsRequest) returns (stream RuntimeEvent);
  rpc WatchMetrics(WatchMetricsRequest) returns (stream MetricsSample);
  rpc Logs(OperatorLogsRequest) returns (stream LogRecord);
  rpc StopContainer(OperatorStopContainerRequest) returns (ContainerResponse);
  rpc ContinueContainer(OperatorContainerMutationRequest) returns (ContainerResponse);
  rpc SignalContainer(OperatorSignalContainerRequest) returns (google.protobuf.Empty);
  rpc DeleteContainer(OperatorDeleteContainerRequest) returns (google.protobuf.Empty);
  rpc UpdateEnvironmentPolicy(UpdateEnvironmentPolicyRequest) returns (GetEnvironmentResponse);
  rpc ApplyNetworkLink(ApplyNetworkLinkRequest) returns (google.protobuf.Empty);
  rpc DeleteNetworkLink(DeleteNetworkLinkRequest) returns (google.protobuf.Empty);
  rpc PlanResetEnvironment(PlanEnvironmentRequest) returns (CleanupPlanResponse);
  rpc PlanDiscardEnvironment(PlanEnvironmentRequest) returns (CleanupPlanResponse);
  rpc ExecuteCleanup(ExecuteCleanupRequest) returns (OperationResponse);
  rpc GetOperation(GetOperationRequest) returns (OperationResponse);
  rpc RunDiagnostics(RunDiagnosticsRequest) returns (OperationResponse);
  rpc PreviewSupportBundle(PreviewSupportBundleRequest) returns (SupportBundlePreview);
  rpc ExportSupportBundle(ExportSupportBundleRequest) returns (OperationResponse);
  rpc BeginRemoteEnrollment(BeginRemoteEnrollmentRequest) returns (RemoteRegistrationResponse);
  rpc ApplyManagedRemoteEnrollment(ApplyManagedRemoteEnrollmentRequest) returns (RemoteRegistrationResponse);
  rpc CompleteRemoteEnrollment(CompleteRemoteEnrollmentRequest) returns (RemoteRegistrationResponse);
  rpc FailRemoteEnrollment(FailRemoteEnrollmentRequest) returns (RemoteRegistrationResponse);
  rpc RetryRemoteEnrollment(RetryRemoteEnrollmentRequest) returns (RemoteRegistrationResponse);
  rpc RemoveIncompleteRemoteRegistration(RemoveIncompleteRemoteRegistrationRequest) returns (google.protobuf.Empty);
  rpc BeginRemoteRevocation(BeginRemoteRevocationRequest) returns (RemoteRegistrationResponse);
  rpc CompleteRemoteRevocation(CompleteRemoteRevocationRequest) returns (RemoteRegistrationResponse);
  rpc UpdateRemotePool(UpdateRemotePoolRequest) returns (RemoteRegistrationResponse);
  rpc SetRemoteRegistrationState(SetRemoteRegistrationStateRequest) returns (RemoteRegistrationResponse);
  rpc GetRemoteRegistration(GetRemoteRegistrationRequest) returns (RemoteRegistrationResponse);
  rpc ListRemoteRegistrations(ListRemoteRegistrationsRequest) returns (ListRemoteRegistrationsResponse);
  rpc GetDeviceIdentity(GetDeviceIdentityRequest) returns (DeviceIdentityResponse);
  rpc RotateDeviceRoot(RotateDeviceRootRequest) returns (RotateDeviceRootResponse);
  rpc ListPersonalMeshes(ListPersonalMeshesRequest) returns (ListPersonalMeshesResponse);
  rpc CreatePersonalMesh(CreatePersonalMeshRequest) returns (PersonalMeshResponse);
  rpc ApplyPersonalMeshSnapshot(ApplyPersonalMeshSnapshotRequest) returns (PersonalMeshResponse);
  rpc RevokePersonalMeshMember(RevokePersonalMeshMemberRequest) returns (PersonalMeshResponse);
  rpc BeginPersonalMeshPairing(BeginPersonalMeshPairingRequest) returns (PersonalMeshPairingResponse);
  rpc JoinPersonalMeshPairing(JoinPersonalMeshPairingRequest) returns (PersonalMeshPairingResponse);
  rpc GetPersonalMeshPairing(GetPersonalMeshPairingRequest) returns (PersonalMeshPairingResponse);
  rpc ConfirmPersonalMeshPairing(ConfirmPersonalMeshPairingRequest) returns (PersonalMeshPairingResponse);
  rpc RejectPersonalMeshPairing(RejectPersonalMeshPairingRequest) returns (PersonalMeshPairingResponse);
  rpc RepairDeviceIdentity(RepairDeviceIdentityRequest) returns (DeviceIdentityResponse);
  rpc CreatePersonalServiceListener(CreatePersonalServiceListenerRequest) returns (ServiceListenerResponse);
  rpc ListServiceListeners(ListServiceListenersRequest) returns (ListServiceListenersResponse);
  rpc RevokeServiceListener(RevokeServiceListenerRequest) returns (google.protobuf.Empty);
}

message GetDeviceIdentityRequest {}

message DeviceIdentityResponse {
  agentvmm.trust.v1.DeviceIdentity identity = 1;
  DeviceIdentityState state = 2;
}

enum DeviceIdentityState {
  DEVICE_IDENTITY_STATE_UNSPECIFIED = 0;
  DEVICE_IDENTITY_STATE_READY = 1;
  DEVICE_IDENTITY_STATE_NEEDS_REPAIR = 2;
}

message RotateDeviceRootRequest {
  string request_id = 1;
  uint64 expected_root_key_revision = 2;
}

message RotateDeviceRootResponse {
  agentvmm.trust.v1.DeviceIdentity identity = 1;
  agentvmm.trust.v1.DeviceRootRotation rotation = 2;
}

message CreatePersonalMeshRequest {
  string request_id = 1;
  string registry_audience = 2;
}

message ListPersonalMeshesRequest {}

message ListPersonalMeshesResponse {
  repeated PersonalMeshResponse meshes = 1;
}

enum ServiceListenerExposure {
  SERVICE_LISTENER_EXPOSURE_UNSPECIFIED = 0;
  SERVICE_LISTENER_EXPOSURE_DEVICE_LOOPBACK = 1;
  SERVICE_LISTENER_EXPOSURE_LAN = 2;
}

message CreatePersonalServiceListenerRequest {
  string request_id = 1;
  string mesh_id = 2;
  string destination_device_id = 3;
  string destination_export_id = 4;
  ServiceListenerExposure exposure = 5;
  string bind_address = 6;
  uint32 bind_port = 7;
  agentvmm.trust.v1.RouteBudget budget = 8;
}

message ServiceListener {
  string id = 1;
  string mesh_id = 2;
  string destination_device_id = 3;
  string destination_export_id = 4;
  ServiceListenerExposure exposure = 5;
  string listen_address = 6;
  string route_id = 7;
  string capability_id = 8;
  google.protobuf.Timestamp expires_at = 9;
  uint64 revision = 10;
  bool revoked = 11;
}

message ServiceListenerResponse { ServiceListener listener = 1; }
message ListServiceListenersRequest {}
message ListServiceListenersResponse { repeated ServiceListener listeners = 1; }
message RevokeServiceListenerRequest {
  string request_id = 1;
  string listener_id = 2;
  uint64 expected_revision = 3;
}

message PersonalMeshResponse {
  agentvmm.trust.v1.PersonalMeshDescriptor mesh_descriptor = 1;
  agentvmm.trust.v1.MeshSnapshot snapshot = 2;
  agentvmm.trust.v1.RegistryOperation pending_operation = 3;
}

message ApplyPersonalMeshSnapshotRequest {
  string request_id = 1;
  agentvmm.trust.v1.MeshSnapshot snapshot = 2;
  uint64 expected_revision = 3;
}

message RevokePersonalMeshMemberRequest {
  string request_id = 1;
  string mesh_id = 2;
  string device_id = 3;
  uint64 expected_revision = 4;
}

message PersonalMeshPairingInvitation {
  bytes session_id = 1;
  string mesh_id = 2;
  uint64 invite_revision = 3;
  string manager_device_id = 4;
  bytes manager_root_public_key = 5;
  uint64 manager_root_key_revision = 6;
  bytes endpoint_address_json = 7;
  string invite_id = 8;
  bytes nonce = 9;
  google.protobuf.Timestamp expires_at = 10;
}

message BeginPersonalMeshPairingRequest {
  string request_id = 1;
  string mesh_id = 2;
  uint64 expected_revision = 3;
  string pin = 4;
}

message JoinPersonalMeshPairingRequest {
  PersonalMeshPairingInvitation invitation = 1;
  string pin = 2;
  repeated agentvmm.trust.v1.MeshPermission permissions = 3;
}

message GetPersonalMeshPairingRequest { bytes session_id = 1; }
message ConfirmPersonalMeshPairingRequest { bytes session_id = 1; }
message RejectPersonalMeshPairingRequest { bytes session_id = 1; }

message PersonalMeshPairingResponse {
  PersonalMeshPairingInvitation invitation = 1;
  string role = 2;
  string state = 3;
  uint32 attempts_remaining = 4;
  string sas = 5;
  agentvmm.trust.v1.RegistryOperation pending_operation = 6;
}

message RepairDeviceIdentityRequest {
  string request_id = 1;
  bool confirm_membership_reset = 2;
}

service RemoteComputeService {
  rpc GetRemoteState(GetRemoteStateRequest) returns (GetRemoteStateResponse);
  rpc GetRemoteObservation(GetRemoteObservationRequest) returns (GetRemoteObservationResponse);
  rpc SetConnectionState(SetConnectionStateRequest) returns (GetRemoteStateResponse);
  rpc SetRemoteAdmissionState(SetRemoteAdmissionStateRequest) returns (GetRemoteStateResponse);
  rpc ReportConnectorStatus(ReportConnectorStatusRequest) returns (GetRemoteStateResponse);
  rpc EnsureAllocation(EnsureAllocationRequest) returns (AllocationResponse);
  rpc ReleaseAllocation(ReleaseAllocationRequest) returns (AllocationResponse);
  rpc PlanCleanupAllocation(PlanCleanupAllocationRequest) returns (AllocationCleanupPlanResponse);
  rpc ExecuteCleanupAllocation(ExecuteCleanupAllocationRequest) returns (AllocationResponse);
  rpc AcquireLease(AcquireLeaseRequest) returns (LeaseResponse);
  rpc RenewLease(RenewLeaseRequest) returns (LeaseResponse);
  rpc ReleaseLease(ReleaseLeaseRequest) returns (LeaseResponse);
  rpc OpenRuntimeSession(OpenRuntimeSessionRequest) returns (CreateAgentSessionResponse);
  rpc RevokeRuntimeSession(RevokeRuntimeSessionRequest) returns (google.protobuf.Empty);
  rpc AcquireHostLoopbackFrontend(AcquireHostLoopbackFrontendRequest) returns (HostLoopbackFrontendLease);
  rpc RenewHostLoopbackFrontend(RenewHostLoopbackFrontendRequest) returns (HostLoopbackFrontendLease);
  rpc ReleaseHostLoopbackFrontend(ReleaseHostLoopbackFrontendRequest) returns (google.protobuf.Empty);
  rpc AcceptHostLoopbackFrontend(stream ControllerFrontendFrame) returns (stream HostFrontendFrame);
}

message HostLoopbackFrontendCapacity {
  uint32 max_active_leases = 1;
  uint32 max_active_leases_per_allocation = 2;
  uint32 max_lease_seconds = 3;
  uint32 max_concurrent_connections = 4;
  uint32 max_concurrent_connections_per_lease = 5;
  uint32 max_frame_bytes = 6;
  uint64 max_connection_bytes = 7;
  uint32 connection_deadline_seconds = 8;
  uint32 connection_idle_seconds = 9;
  uint32 max_use_count = 10;
}

message HostLoopbackFrontendLease {
  string frontend_lease_id = 1;
  uint64 generation = 2;
  string registration_id = 3;
  string connection_instance = 4;
  string allocation_id = 5;
  string allocation_lease_id = 6;
  uint64 allocation_lease_generation = 7;
  uint64 allocation_revision = 8;
  string assignment_id = 9;
  string endpoint = 10;
  bytes access_token = 11;
  google.protobuf.Timestamp expires_at = 12;
  HostLoopbackFrontendCapacity effective_capacity = 13;
  uint64 connection_epoch = 14;
}

message AcquireHostLoopbackFrontendRequest {
  string registration_id = 1;
  string connection_instance = 2;
  string allocation_id = 3;
  string allocation_lease_id = 4;
  uint64 allocation_lease_generation = 5;
  uint64 target_revision = 6;
  string assignment_id = 7;
  google.protobuf.Duration duration = 8;
  uint64 connection_epoch = 9;
}

message RenewHostLoopbackFrontendRequest {
  string registration_id = 1;
  string connection_instance = 2;
  string frontend_lease_id = 3;
  uint64 generation = 4;
  string allocation_lease_id = 5;
  uint64 allocation_lease_generation = 6;
  google.protobuf.Duration duration = 7;
  uint64 connection_epoch = 8;
}

message ReleaseHostLoopbackFrontendRequest {
  string registration_id = 1;
  string connection_instance = 2;
  string frontend_lease_id = 3;
  uint64 generation = 4;
  uint64 connection_epoch = 5;
}

message HostLoopbackFrontendAccept {
  string registration_id = 1;
  string connection_instance = 2;
  uint64 connection_epoch = 3;
}

message HostLoopbackFrontendConnectionHeader {
  string registration_id = 1;
  string connection_instance = 2;
  string frontend_lease_id = 3;
  uint64 frontend_lease_generation = 4;
  string allocation_id = 5;
  string allocation_lease_id = 6;
  uint64 allocation_lease_generation = 7;
  uint64 allocation_revision = 8;
  string assignment_id = 9;
  string connection_id = 10;
  HostLoopbackFrontendCapacity effective_capacity = 11;
  uint64 connection_epoch = 12;
}

message HostLoopbackFrontendConnectionAck {
  string connection_id = 1;
  bool accepted = 2;
  string reason = 3;
}

message HostLoopbackFrontendEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_EXPIRED = 1;
    KIND_REVOKED = 2;
    KIND_RELEASED = 3;
    KIND_CLOSED = 4;
  }
  Kind kind = 1;
  string frontend_lease_id = 2;
  uint64 generation = 3;
  string assignment_id = 4;
  string connection_id = 5;
}

message HostFrontendFrame {
  oneof payload {
    HostLoopbackFrontendConnectionHeader header = 1;
    bytes data = 2;
    bool close_write = 3;
    HostLoopbackFrontendEvent event = 4;
  }
}

message ControllerFrontendFrame {
  oneof payload {
    HostLoopbackFrontendAccept accept = 1;
    HostLoopbackFrontendConnectionAck ack = 2;
    bytes data = 3;
    bool close_write = 4;
  }
}

enum WorkspaceEntryKind {
  WORKSPACE_ENTRY_KIND_UNSPECIFIED = 0;
  WORKSPACE_ENTRY_KIND_FILE = 1;
  WORKSPACE_ENTRY_KIND_DIRECTORY = 2;
}

message WorkspacePathRequest { string path = 1; }
message WorkspaceEntry {
  string path = 1;
  WorkspaceEntryKind kind = 2;
  uint64 size = 3;
  uint32 mode = 4;
  int64 modified_unix_nanos = 5;
  bytes sha256 = 6;
}
message ListWorkspaceRequest { string path = 1; uint32 limit = 2; }
message ListWorkspaceResponse { repeated WorkspaceEntry entries = 1; }
message ReadWorkspaceRequest { string path = 1; uint64 offset = 2; uint64 max_bytes = 3; string volume_id = 4; }
message ReadWorkspaceResponse { bytes data = 1; uint64 offset = 2; bytes sha256 = 3; bool final = 4; }
message WriteWorkspaceHeader {
  string request_id = 1;
  string path = 2;
  uint64 offset = 3;
  bytes expected_prefix_sha256 = 4;
  uint32 mode = 5;
  string volume_id = 6;
}
message WriteWorkspaceRequest {
  oneof payload { WriteWorkspaceHeader header = 1; bytes data = 2; bool finish = 3; }
}
message WriteWorkspaceResponse { WorkspaceEntry entry = 1; bytes sha256 = 2; }
message ArchiveWorkspaceRequest { string path = 1; }
message ArchiveWorkspaceResponse { bytes data = 1; bytes sha256 = 2; bool final = 3; }
message ExtractWorkspaceHeader { string request_id = 1; string path = 2; }
message ExtractWorkspaceRequest {
  oneof payload { ExtractWorkspaceHeader header = 1; bytes data = 2; bool finish = 3; }
}

message CreateServiceExportRequest {
  string request_id = 1;
  string container_id = 2;
  string container_instance_id = 3;
  uint32 port = 4;
  agentvmm.service.v1.ServiceProtocol protocol = 5;
}
message ListOwnServiceExportsRequest {}
message GetOwnServiceExportRequest { string export_id = 1; }
message RevokeOwnServiceExportRequest { string request_id = 1; string export_id = 2; uint64 expected_revision = 3; }
message CreateServiceImportRequest {
  string request_id = 1;
  string source_container_id = 2;
  string source_container_instance_id = 3;
  string destination_device_id = 4;
  string destination_export_id = 5;
  string virtual_service_name = 6;
  agentvmm.trust.v1.RouteCapability capability = 7;
  uint32 destination_port = 8;
}

message CreatePersonalServiceImportRequest {
  string request_id = 1;
  string mesh_id = 2;
  string source_container_id = 3;
  string source_container_instance_id = 4;
  string destination_device_id = 5;
  string destination_export_id = 6;
  string virtual_service_name = 7;
  agentvmm.trust.v1.RouteBudget budget = 8;
}
message ListServiceImportsRequest {}
message ListServiceImportsResponse { repeated agentvmm.service.v1.ServiceImport imports = 1; }
message GetServiceImportRequest { string import_id = 1; }
message RevokeServiceImportRequest { string request_id = 1; string import_id = 2; uint64 expected_revision = 3; }

enum VMState {
  VM_STATE_UNSPECIFIED = 0;
  VM_STATE_STOPPED = 1;
  VM_STATE_STARTING = 2;
  VM_STATE_RUNNING = 3;
  VM_STATE_STOPPING = 4;
  VM_STATE_FAILED = 5;
}

message VM {
  VMState state = 1;
  string boot_id = 2;
  string error = 3;
}

message StartVMRequest {
  string request_id = 1;
}
message GetVMRequest {}
message StopVMRequest {
  string request_id = 1;
  bool force = 2;
}
message VMResponse {
  VM vm = 1;
}

enum EgressMode {
  EGRESS_MODE_UNSPECIFIED = 0;
  EGRESS_MODE_DENY_ALL = 1;
  EGRESS_MODE_PUBLIC_INTERNET = 2;
}

message ResourceLimits {
  optional uint32 cpu_millis = 1;
  optional uint64 memory_bytes = 2;
  optional uint32 pids = 3;
  optional uint64 disk_bytes = 4;
}

// WorkloadResourcesV2 is the only resource contract accepted by remote
// allocation admission. Each field limits one workload, without reserving
// the sum of maxima across stored workloads.
message WorkloadResourcesV2 {
  reserved 1, 3, 4;
  reserved "cpu_guarantee_millis", "cpu_weight", "memory_high_bytes";
  uint32 cpu_max_millis = 2;
  uint64 memory_max_bytes = 5;
  uint32 pid_max = 6;
  uint64 writable_quota_bytes = 7;
}

enum EnvironmentOwnerKind {
  ENVIRONMENT_OWNER_KIND_UNSPECIFIED = 0;
  ENVIRONMENT_OWNER_KIND_LOCAL = 1;
  ENVIRONMENT_OWNER_KIND_REMOTE_REGISTRATION = 2;
}

message EnvironmentOwner {
  EnvironmentOwnerKind kind = 1;
  string registration_id = 2;
  string allocation_id = 3;
}

enum EnvironmentOrigin {
  ENVIRONMENT_ORIGIN_UNSPECIFIED = 0;
  ENVIRONMENT_ORIGIN_LOCAL = 1;
  ENVIRONMENT_ORIGIN_REMOTE = 2;
}

message AgentEnvironment {
  string id = 1;
  string display_name = 2;
  string namespace_id = 3;
  ResourceLimits limits = 4;
  EgressMode egress_mode = 5;
  HealthStatus health = 6;
  Usage usage = 7;
  repeated Container containers = 8;
  repeated Volume volumes = 9;
  uint64 policy_revision = 10;
  EnvironmentOwner owner = 11;
  EnvironmentOrigin origin = 12;
  InventoryState inventory_state = 13;
  string inventory_message = 14;
  google.protobuf.Timestamp inventory_observed_at = 15;
}

enum InventoryState {
  INVENTORY_STATE_UNSPECIFIED = 0;
  INVENTORY_STATE_AVAILABLE = 1;
  INVENTORY_STATE_VM_STOPPED = 2;
  INVENTORY_STATE_UNAVAILABLE = 3;
  INVENTORY_STATE_STALE = 4;
}

message CreateAgentSessionRequest {
  string request_id = 1;
  string integration_id = 2;
}
message CreateAgentSessionResponse {
  string session_id = 1;
  string socket_path = 2;
  AgentEnvironment environment = 3;
  google.protobuf.Timestamp expires_at = 4;
}
message RevokeAgentSessionRequest {
  string request_id = 1;
  string session_id = 2;
}

enum IntegrationScope {
  INTEGRATION_SCOPE_UNSPECIFIED = 0;
  INTEGRATION_SCOPE_USER = 1;
  INTEGRATION_SCOPE_WORKSPACE = 2;
  INTEGRATION_SCOPE_MANUAL = 3;
}

enum IntegrationDesiredState {
  INTEGRATION_DESIRED_STATE_UNSPECIFIED = 0;
  INTEGRATION_DESIRED_STATE_ALLOWED = 1;
  INTEGRATION_DESIRED_STATE_REMOVED = 2;
}

enum IntegrationConfigState {
  INTEGRATION_CONFIG_STATE_UNSPECIFIED = 0;
  INTEGRATION_CONFIG_STATE_PENDING = 1;
  INTEGRATION_CONFIG_STATE_READY = 2;
  INTEGRATION_CONFIG_STATE_NEEDS_RESTART = 3;
  INTEGRATION_CONFIG_STATE_CONFLICT = 4;
  INTEGRATION_CONFIG_STATE_ERROR = 5;
  INTEGRATION_CONFIG_STATE_REMOVING = 6;
  INTEGRATION_CONFIG_STATE_REMOVED = 7;
  INTEGRATION_CONFIG_STATE_CONFIGURING = 8;
}

message AgentIntegration {
  string id = 1;
  string adapter_id = 2;
  string display_name = 3;
  IntegrationScope scope = 4;
  string config_target = 5;
  string environment_id = 6;
  IntegrationDesiredState desired_state = 7;
  IntegrationConfigState config_state = 8;
  string config_fingerprint = 9;
  uint64 revision = 10;
  string last_error_code = 11;
  string last_error_message = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  google.protobuf.Timestamp last_verified_at = 15;
}

message ListAgentIntegrationsRequest {
  bool include_removed = 1;
}
message ListAgentIntegrationsResponse {
  repeated AgentIntegration integrations = 1;
}
message PrepareAgentIntegrationRequest {
  string request_id = 1;
  string adapter_id = 2;
  string display_name = 3;
  IntegrationScope scope = 4;
  string config_target = 5;
  optional string environment_id = 6;
}
message BeginAgentIntegrationConfigurationRequest {
  string request_id = 1;
  string integration_id = 2;
  uint64 expected_revision = 3;
}
message CommitAgentIntegrationRequest {
  string request_id = 1;
  string integration_id = 2;
  uint64 expected_revision = 3;
  string config_fingerprint = 4;
  bool needs_restart = 5;
}
message FailAgentIntegrationRequest {
  string request_id = 1;
  string integration_id = 2;
  uint64 expected_revision = 3;
  string error_code = 4;
  string error_message = 5;
}
message BeginAgentIntegrationRemovalRequest {
  string request_id = 1;
  string integration_id = 2;
  uint64 expected_revision = 3;
}
message CompleteAgentIntegrationRemovalRequest {
  string request_id = 1;
  string integration_id = 2;
  uint64 expected_revision = 3;
}
message AgentIntegrationResponse {
  AgentIntegration integration = 1;
}

enum AgentSessionOrigin {
  AGENT_SESSION_ORIGIN_UNSPECIFIED = 0;
  AGENT_SESSION_ORIGIN_LOCAL_INTEGRATION = 1;
  AGENT_SESSION_ORIGIN_REMOTE_LEASE = 2;
}
enum AgentSessionState {
  AGENT_SESSION_STATE_UNSPECIFIED = 0;
  AGENT_SESSION_STATE_LISTENING = 1;
  AGENT_SESSION_STATE_CONNECTED = 2;
  AGENT_SESSION_STATE_REVOKED = 3;
  AGENT_SESSION_STATE_EXPIRED = 4;
  AGENT_SESSION_STATE_CLOSED = 5;
}
message AgentSession {
  string id = 1;

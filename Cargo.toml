[workspace]
resolver = "2"
members = [
    "bins/agent-vmm",
    "bins/agent-vmm-carrier",
    "bins/agent-vmm-host",
    "bins/agent-vmm-lifecycle",
    "bins/agent-vmm-service-executor",
    "bins/l4h-dom0d",
    "bins/vmm-guest-init",
    "crates/agent-vmm-proto",
    "crates/vmm-carrier-macos",
    "crates/vmm-comma-contract-tests",
    "crates/vmm-compat",
    "crates/vmm-core",
    "crates/vmm-dom0",
    "crates/vmm-guest-proto",
    "crates/vmm-mcp",
    "crates/vmm-l4hctl",
    "crates/vmm-lifecycle",
    "crates/vmm-remote-salix",
    "crates/vmm-signing",
    "data/agent-vmm-data",
    "data/agent-vmm-data/netdev-compat",
]
exclude = ["third_party/l4h"]

[workspace.package]
edition = "2024"

[patch.crates-io]
netdev = { path = "data/agent-vmm-data/netdev-compat" }

[profile.dev]
debug = 0

[profile.test]
debug = 0

name: AgentVMM
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 15.0
    PRODUCT_BUNDLE_IDENTIFIER: surf.afk.AgentVMM
    CODE_SIGN_STYLE: Automatic
packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    exactVersion: 1.38.1
targets:
  AgentVMM:
    type: application
    platform: macOS
    sources:
      - App
      - Domain
      - HostClient
      - Features
      - DesignSystem
      - Generated
    dependencies:
      - package: SwiftProtobuf
        product: SwiftProtobuf
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Agent VMM
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 AFK AI, Inc. Licensed under AGPL-3.0-or-later.
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Agent VMM
        LSApplicationCategoryType: public.app-category.developer-tools
  AgentVMMTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: AgentVMM
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AgentVMM:
    build:
      targets:
        AgentVMM: all
        AgentVMMTests: [test]
    test:
      preActions:
        - name: Build Rust operator for interoperability tests
          settingsTarget: AgentVMMTests
          script: |
            set -eu
            export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
            cd "$SRCROOT/../../.."
            export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$PWD/target}"
            mkdir -p "$CARGO_TARGET_DIR" "$BUILT_PRODUCTS_DIR"
            PROTOC=$(sh build/protoc.sh "$CARGO_TARGET_DIR")
            export PROTOC
            cargo build --locked -p agent-vmm-host
            ln -sf "$CARGO_TARGET_DIR/debug/agent-vmm-host" "$BUILT_PRODUCTS_DIR/agent-vmm-interop-host"
      targets:
        - AgentVMMTests

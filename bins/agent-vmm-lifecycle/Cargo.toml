[package]
name = "agent-vmm-lifecycle"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-only"
publish = false

[features]
# Lets the contract test run this helper away from the production Host.
e2e-isolation = ["vmm-lifecycle/e2e-isolation"]

[dependencies]
vmm-lifecycle = { path = "../../crates/vmm-lifecycle" }

[dev-dependencies]
vmm-rpc = { path = "../../crates/vmm-rpc" }
agent-vmm-proto = { path = "../../crates/agent-vmm-proto" }
bytes = "1"
http = "1"
prost = "0.14"
prost-types = "0.14"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["net", "rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["net"] }
vmm-comma-contract-tests = { path = "../../crates/vmm-comma-contract-tests" }

[[test]]
name = "contract"
required-features = ["e2e-isolation"]

[lints.rust]
unsafe_code = "forbid"

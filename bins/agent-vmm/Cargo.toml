[package]
name = "agent-vmm"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-only"
publish = false

[dependencies]
vmm-rpc = { path = "../../crates/vmm-rpc" }
agent-vmm-proto = { path = "../../crates/agent-vmm-proto" }
getrandom = "0.3"
prost = "0.14"
regex = "1"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-stream = "0.1"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
url = "2"
uzers = "0.12"
vmm-lifecycle = { path = "../../crates/vmm-lifecycle" }

[target.'cfg(target_os = "linux")'.dependencies]
agent-vmm-host = { path = "../agent-vmm-host" }
flate2 = "1"
tar = "0.4"

[lints.rust]
unsafe_code = "forbid"

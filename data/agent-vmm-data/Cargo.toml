[package]
name = "agent-vmm-data"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1"
chacha20poly1305 = { version = "0.10", features = ["std"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
hex = "0.4"
iroh = "1.4.1"
pakery-core = "0.6.1"
pakery-crypto = { version = "0.6.1", default-features = false, features = ["std", "p256", "spake2"] }
pakery-spake2 = "0.6.1"
rand_core = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "io-util", "time"] }
zeroize = "1.8"

[dev-dependencies]
pakery-spake2 = { version = "0.6.1", features = ["test-utils"] }
tempfile = "3"

[patch.crates-io]
netdev = { path = "netdev-compat" }

[package]
name = "agent-vmm-data"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chacha20poly1305 = "0.10"
hex = "0.4"
iroh = "1.0.3"
pakery-core = "=0.2.1"
pakery-crypto = { version = "=0.2.1", default-features = false, features = ["std", "p256", "spake2"] }
pakery-spake2 = { version = "=0.2.1", features = ["os_rng"] }
rand_core = { version = "0.9", features = ["os_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "io-util", "time"] }
zeroize = "1.8"

[dev-dependencies]
pakery-spake2 = { version = "=0.2.1", features = ["test-utils"] }
tempfile = "3"

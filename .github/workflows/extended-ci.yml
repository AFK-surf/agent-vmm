name: Extended CI

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guest-bundle:
    name: Guest and Linux Host / Linux arm64
    runs-on: ${{ vars.AGENT_VMM_RUNNER_LINUX_ARM || 'ubuntu-24.04-arm' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up persistent Guest builder
        if: startsWith(vars.AGENT_VMM_RUNNER_LINUX_ARM, 'blacksmith-') && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2
        with:
          cache-key: build/guest/Dockerfile@trusted
          platforms: linux/arm64
      - name: Set up local Guest builder
        if: ${{ !(startsWith(vars.AGENT_VMM_RUNNER_LINUX_ARM, 'blacksmith-') && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))) }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Guest bundle
        env:
          AGENT_VMM_REFRESH_DEPENDENCIES: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) && '1' || '0' }}
        run: build/guest/build.sh "$RUNNER_TEMP/guest-bundle" release runtime
      - name: Unpack Guest root filesystem and run sandbox smoke test
        run: |
          sudo apt-get update
          sudo apt-get install --yes squashfs-tools
          unsquashfs -d "$RUNNER_TEMP/guest-rootfs" "$RUNNER_TEMP/guest-bundle/rootfs.squashfs"
          build/guest/smoke.sh "$RUNNER_TEMP/guest-rootfs"
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Generate Guest inventories
        run: build/guest/sbom.sh "$RUNNER_TEMP/guest-rootfs" "$RUNNER_TEMP/inventory/guest"
      - name: Build Linux Host package and inventories
        env:
          AGENT_VMM_GUEST_BUNDLE: ${{ runner.temp }}/guest-bundle
          AGENT_VMM_DATA_WORKER: ${{ github.workspace }}/target/release/agent-vmm-data
          OUTPUT_DIRECTORY: ${{ runner.temp }}/host-bundle
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          cargo build --release --locked --manifest-path data/agent-vmm-data/Cargo.toml --target-dir target
          build/host-linux/package.sh
          mkdir "$RUNNER_TEMP/host-package"
          tar -xf "$RUNNER_TEMP"/host-bundle/*.tar.gz -C "$RUNNER_TEMP/host-package"
          build/host/sbom.sh "$RUNNER_TEMP/host-package" "$RUNNER_TEMP/inventory/host"

  dependency-advisories:
    name: Rust dependency advisories
    if: github.event_name == 'schedule'
    runs-on: ${{ vars.AGENT_VMM_RUNNER_LINUX || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install audit command
        run: cargo install cargo-audit --locked
      - name: Check dependency advisories
        run: make audit-data-worker

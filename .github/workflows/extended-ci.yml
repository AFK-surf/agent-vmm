name: Extended CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guest-bundle:
    name: Guest and Linux Host / Linux arm64
    runs-on: ${{ vars.AGENT_VMM_RUNNER_LINUX_ARM || 'ubuntu-24.04-arm' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Protobuf compiler and Rust toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler squashfs-tools
          rustup toolchain install 1.96.0 --profile minimal --target aarch64-unknown-linux-gnu
          rustup default 1.96.0
      - name: Set up persistent Guest builder
        if: startsWith(vars.AGENT_VMM_RUNNER_LINUX_ARM, 'blacksmith-') && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: useblacksmith/setup-docker-builder@9657a6e02ca6445e6d6ce5ffaf370f4828dea50d # v2
        with:
          cache-key: build/guest/Dockerfile@trusted
          platforms: linux/arm64
      - name: Set up local Guest builder
        if: ${{ !(startsWith(vars.AGENT_VMM_RUNNER_LINUX_ARM, 'blacksmith-') && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))) }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Guest bundle
        env:
          AGENT_VMM_REFRESH_DEPENDENCIES: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && '1' || '0' }}
        run: build/guest/build.sh "$RUNNER_TEMP/guest-bundle" release runtime
      - name: Unpack Guest root filesystem and check its executables
        run: |
          unsquashfs -d "$RUNNER_TEMP/guest-rootfs" "$RUNNER_TEMP/guest-bundle/rootfs.squashfs"
          build/guest/smoke.sh "$RUNNER_TEMP/guest-rootfs"
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Generate Guest inventories
        run: build/guest/sbom.sh "$RUNNER_TEMP/guest-rootfs" "$RUNNER_TEMP/inventory/guest"
      - name: Build Linux Host package and inventories
        env:
          AGENT_VMM_GUEST_BUNDLE: ${{ runner.temp }}/guest-bundle
          AGENT_VMM_RELEASE_ID: agent-vmm-${{ github.sha }}
          CARGO_INCREMENTAL: "0"
          OUTPUT_DIRECTORY: ${{ runner.temp }}/host-bundle
        run: |
          export AGENT_VMM_GUEST_MANIFEST_DIGEST
          AGENT_VMM_GUEST_MANIFEST_DIGEST=$(sha256sum "$AGENT_VMM_GUEST_BUNDLE/manifest.json" | cut -d ' ' -f 1)
          cargo build --locked --release --target aarch64-unknown-linux-gnu -p agent-vmm -p agent-vmm-data
          export AGENT_VMM_HOST_BIN="$PWD/target/aarch64-unknown-linux-gnu/release/agent-vmm"
          export AGENT_VMM_DATA_WORKER="$PWD/target/aarch64-unknown-linux-gnu/release/agent-vmm-data"
          build/host-linux/package.sh
          export AGENT_VMM_LINUX_RELEASE_DIR="$RUNNER_TEMP/host-package"
          mkdir "$AGENT_VMM_LINUX_RELEASE_DIR"
          tar -xf "$OUTPUT_DIRECTORY/agent-vmm-$AGENT_VMM_RELEASE_ID-linux-arm64.tar.gz" \
            -C "$AGENT_VMM_LINUX_RELEASE_DIR" --strip-components=1
          VMM_CONTRACT_REQUIRE_LIVE=1 cargo test --locked -p vmm-comma-contract-tests --test live linux_release_has_the_installer_at_its_root -- --exact
          build/host/sbom.sh "$AGENT_VMM_LINUX_RELEASE_DIR" "$RUNNER_TEMP/inventory/host"

  dependency-advisories:
    name: Rust dependency advisories
    if: github.event_name == 'schedule'
    runs-on: ${{ vars.AGENT_VMM_RUNNER_LINUX || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install audit command
        run: cargo install cargo-audit --locked
      - name: Check dependency advisories
        run: cargo audit --file Cargo.lock

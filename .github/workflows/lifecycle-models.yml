name: Lifecycle models

on:
  push:
    branches:
      - main
    paths:
      - spec/tla/**
      - tools/tla/**
      - .github/workflows/lifecycle-models.yml
  pull_request:
    paths:
      - spec/tla/**
      - tools/tla/**
      - .github/workflows/lifecycle-models.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifecycle-models-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle-models:
    name: Canonical lifecycle models
    runs-on: ${{ vars.AGENT_VMM_RUNNER_LINUX_ARM || 'ubuntu-24.04-arm' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Check canonical lifecycle models
        run: make tla

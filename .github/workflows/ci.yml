name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-linux:
    name: Rust workspace / Linux
    runs-on: ${{ vars.AGENT_VMM_RUNNER_LINUX || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Protobuf compiler and console build packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler libfontconfig1-dev mesa-vulkan-drivers
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          rustup default 1.96.0
      - name: Test and lint the Rust workspace
        env:
          CARGO_INCREMENTAL: "0"
        run: make fmt-check test-rust lint-rust
      - name: Test and lint the console
        env:
          CARGO_INCREMENTAL: "0"
        run: ./apps/console/scripts/verify.sh

  linux-arm64:
    name: Protocol and workflows / Linux arm64
    runs-on: ${{ vars.AGENT_VMM_RUNNER_LINUX_ARM || 'ubuntu-24.04-arm' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          version: 1.69.0
          setup_only: true
      - name: Lint workflows
        run: |
          case "$(uname -m)" in
            aarch64) arch=arm64; digest=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6 ;;
            x86_64) arch=amd64; digest=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 ;;
            *) exit 1 ;;
          esac
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_$arch.tar.gz"
          printf '%s  %s\n' "$digest" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: Check protobuf lint
        run: make proto-check
      - name: Check protobuf compatibility
        if: github.event_name == 'pull_request'
        env:
          PROTO_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: make proto-breaking

  macos:
    name: macOS app and packaging
    runs-on: ${{ vars.AGENT_VMM_RUNNER_MACOS || 'macos-15' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          version: 1.69.0
          setup_only: true
      - name: Install Protobuf compiler and Rust toolchain
        run: |
          brew install protobuf
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt --target aarch64-apple-darwin
          rustup default 1.96.0
      - name: Test build tools on macOS
        run: make test
      - name: Test and lint the console
        env:
          CARGO_INCREMENTAL: "0"
        run: ./apps/console/scripts/verify.sh
      - name: Check generated API reference
        run: make check-api-docs
      - name: Test Host installer resume contract
        run: build/host/install.test.sh
      - name: Package the ad-hoc Host and check the Comma contracts
        env:
          CARGO_INCREMENTAL: "0"
        run: sh build/host/package.test.sh

version: v2
modules:
  - path: api
lint:
  ignore:
    - api/google/rpc
  use:
    - STANDARD
    - COMMENT_SERVICE
    - COMMENT_RPC
    - COMMENT_MESSAGE
  except:
    - PACKAGE_DIRECTORY_MATCH
breaking:
  ignore:
    - api/internal
  use:
    - PACKAGE
  except:
    - RPC_NO_DELETE
    - PACKAGE_MESSAGE_NO_DELETE

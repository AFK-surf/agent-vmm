[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1"
bstr = "1"
hex = "0.4"
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "macho", "std", "unaligned"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
walkdir = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

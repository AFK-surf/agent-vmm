[package]
name = "vmm-guest-proto"
version = "0.1.0"
edition.workspace = true
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
hmac = "0.12"
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
subtle = "2"
zeroize = { version = "1.8", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"

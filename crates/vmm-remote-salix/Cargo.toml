[package]
name = "vmm-remote-salix"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
hex = "0.4"
http = "1"
subtle = "2"
tokio-util = { version="0.7", features=["rt"] }
vmm-rpc = { path = "../vmm-rpc" }
agent-vmm-proto = { path = "../agent-vmm-proto" }
base64 = "0.22"
getrandom = "0.4"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-stream = "0.1"
vmm-core = { path = "../vmm-core" }
vmm-signing = { path = "../vmm-signing" }
zeroize = "1"

[dev-dependencies]
prost-types = "0.14"
axum = "0.8"
rcgen = "0.14"
tempfile = "3"
tokio = { version = "1", features = ["net", "rt-multi-thread", "test-util"] }
tokio-stream = { version = "0.1", features = ["net"] }

[lints.rust]
unsafe_code = "forbid"

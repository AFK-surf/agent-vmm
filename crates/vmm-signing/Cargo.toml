[package]
name = "vmm-signing"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-only"
publish = false

[dependencies]
agent-vmm-proto = { path = "../agent-vmm-proto" }
base64 = "0.22"
hex = "0.4"
p256 = { version = "0.13", features = ["ecdsa"] }
prost = "0.14"
prost-reflect = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }
tempfile = "3"

[dev-dependencies]
prost-reflect = { version = "0.16", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"

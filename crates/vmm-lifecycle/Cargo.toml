[package]
name = "vmm-lifecycle"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-only"
publish = false

[features]
# Moves the service home and the launchd label of a test build away from the
# production Host. A release build never enables it.
e2e-isolation = []

[dependencies]
vmm-rpc = { path = "../vmm-rpc" }
agent-vmm-proto = { path = "../agent-vmm-proto" }
base64 = "0.22"
getrandom = "0.3"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
prost-types = "0.14"
rusqlite = { version = "0.39", features = ["bundled"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
url = "2"
uzers = "0.12"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["net"] }

[lints.rust]
unsafe_code = "forbid"

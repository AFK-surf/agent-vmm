[package]
name = "vmm-compat"
version = "0.1.0"
edition.workspace = true
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
vmm-rpc = { path = "../vmm-rpc" }
http-auth = { version = "0.1", default-features = false }
oci-spec = { version = "0.10", default-features = false, features = ["distribution"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
vmm-mcp = { path = "../vmm-mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
hex = "0.4"
rustix = { version = "1", features = ["fs"] }
rusqlite = { version = "0.39", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3"
tokio-stream = "0.1"
vmm-guest-proto = { path = "../vmm-guest-proto" }
agent-vmm-data = { path = "../../data/agent-vmm-data" }
agent-vmm-proto = { path = "../agent-vmm-proto" }
base64 = "0.22"
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["rt", "fs", "io-util", "sync", "net", "process", "time"] }
vmm-signing = { path = "../vmm-signing" }
vmm-core = { path = "../vmm-core" }
zeroize = "1"

[dev-dependencies]
http = "1"
tokio = { version = "1", features = ["macros","rt-multi-thread","net","test-util"] }
tokio-stream = { version = "0.1", features = ["net"] }

[lints.rust]
unsafe_code = "forbid"
